   `Kiểm tra cọc: q<sub>u</sub> / FS = ${fmt(n.qu)} / ${fmt(n.FS)} = ${fmt(n.qu/n.FS,1)} kPa. σ<sub>p</sub> = ${fmt(sp,1)} kPa ${ok?"nhỏ hơn hoặc bằng":"lớn hơn"} giá trị này nên cọc <b>${ok?"đạt":"không đạt"}</b>. Đây là kiểm tra sơ bộ theo giả thiết cọc và đất lún bằng nhau; kiểm toán chính thức theo tiêu chuẩn đã nêu trong khóa học.`]};
 }},
/* ---- 6. Trượt φ = 0 ---- */
{id:"slip",title:"Ổn định trượt cung tròn, đất sét yếu φ = 0",desc:"Tính nhanh hệ số an toàn F<sub>s</sub> của một cung trượt giả định bằng mô men quanh tâm.",topics:["m6t1"],
 fields:[F_("cu","Cường độ không thoát nước, c_u",20,"kPa"),F_("R","Bán kính cung trượt, R",10,"m"),F_("th","Góc ở tâm của cung, θ",90,"độ"),F_("W","Trọng lượng khối trượt, W",400,"kN/m","Trên 1 m dài nền"),F_("x","Cánh tay đòn của W, x",7,"m","Khoảng cách ngang từ trọng tâm khối trượt đến phương thẳng đứng qua tâm O"),F_("Fr","Fs yêu cầu",1.3,"","Theo tiêu chuẩn dự án; 1,3 chỉ là ví dụ")],
 syms:[["c<sub>u</sub>","Cường độ chống cắt không thoát nước (kPa)."],["R","Bán kính cung trượt (m)."],["θ","Góc ở tâm chắn cung trượt (độ)."],["L","Chiều dài cung = π R θ / 180 (m)."],["W","Trọng lượng khối đất trượt trên một mét dài (kN/m)."],["x","Cánh tay đòn của W so với tâm O (m)."],["F<sub>s</sub>","Hệ số an toàn = mô men chống / mô men gây trượt."]],
 compute(v){
  const n=reqNums(v,["cu","R","th","W","x","Fr"]); if(n.err) return n;
  if(n.cu<=0||n.R<=0||n.th<=0||n.th>180||n.W<=0||n.x<=0) return {err:"c_u, R, W, x phải lớn hơn 0; θ nằm trong khoảng 0–180°."};
  const L=Math.PI*n.R*n.th/180, Mr=n.cu*L*n.R, Md=n.W*n.x, Fs=Mr/Md, ok=Fs>=n.Fr;
  return {res:[["F<sub>s</sub>",fmt(Fs,3),ok?"Đạt yêu cầu "+fmt(n.Fr):"Chưa đạt yêu cầu "+fmt(n.Fr)],["Mô men chống",fmt(Mr,0)+" kN·m/m",""],["Mô men gây trượt",fmt(Md,0)+" kN·m/m",""],["Chiều dài cung L",fmt(L,2)+" m",""]],
   warn:Fs<1?["F<sub>s</sub> nhỏ hơn 1: về mặt lý thuyết cung trượt này đã mất ổn định."]:[],
   steps:[`Chiều dài cung: L = {{π R θ|180}} = {{3,1416 × ${fmt(n.R)} × ${fmt(n.th)}|180}} = <b>${fmt(L,3)} m</b>.`,`Mô men chống trượt: M<sub>chống</sub> = c<sub>u</sub> × L × R = ${fmt(n.cu)} × ${fmt(L,3)} × ${fmt(n.R)} = <b>${fmt(Mr,1)} kN·m/m</b>.`,`Mô men gây trượt: M<sub>gây</sub> = W × x = ${fmt(n.W)} × ${fmt(n.x)} = <b>${fmt(Md,1)} kN·m/m</b>.`,`Hệ số an toàn: F<sub>s</sub> = {{M<sub>chống</sub>|M<sub>gây</sub>}} = {{${fmt(Mr,1)}|${fmt(Md,1)}}} = <b>${fmt(Fs,3)}</b>. So với yêu cầu ${fmt(n.Fr)}: <b>${ok?"đạt":"chưa đạt"}</b>.`,`Nhớ rằng đây chỉ là một cung trượt giả định. Phải thử rất nhiều tâm và bán kính (bằng Geoslope) rồi lấy F<sub>s</sub> nhỏ nhất.`]};
 }},
/* ---- 7. Cắt cánh ---- */
{id:"vane",title:"Thí nghiệm cắt cánh: S<sub>u</sub> và hiệu chỉnh",desc:"Từ mô men xoắn lớn nhất tính S<sub>u</sub>, hiệu chỉnh theo Bjerrum, tính độ nhạy.",topics:["m6t3"],
 fields:[F_("T","Mô men xoắn lớn nhất, T",12.5,"N·m"),F_("D","Đường kính cánh, D",65,"mm"),F_("H","Chiều cao cánh, H",130,"mm"),F_("Ip","Chỉ số dẻo của sét, I_P",50,"%","Để tính hệ số hiệu chỉnh μ"),F_("Tr","Mô men xoắn dư (đã xáo trộn), T_r",3,"N·m","Có thể để trống; dùng tính độ nhạy")],
 syms:[["T","Mô men xoắn lớn nhất khi đất bị phá hoại."],["D, H","Đường kính và chiều cao cánh."],["S<sub>u</sub>","Cường độ cắt không thoát nước đo được (kPa)."],["μ","Hệ số hiệu chỉnh Bjerrum = 1,7 − 0,54 lg(I<sub>P</sub>)."],["S<sub>u,tk</sub>","Giá trị dùng thiết kế = μ × S<sub>u</sub>."],["S<sub>t</sub>","Độ nhạy = S<sub>u</sub> / S<sub>u,dư</sub>."]],
 compute(v){
  const n=reqNums(v,["T","D","H","Ip"]); if(n.err) return n;
  if(n.T<=0||n.D<=0||n.H<=0||n.Ip<=0) return {err:"T, D, H, I_P phải lớn hơn 0."};
  const T=n.T/1000, D=n.D/1000, H=n.H/1000, den=Math.PI*D*D*(H+D/3), Su=2*T/den, mu=1.7-0.54*lg(n.Ip), Sut=mu*Su, Tr=num(v.Tr), St=(!isNaN(Tr)&&Tr>0)?n.T/Tr:NaN, warn=[];
  if(mu<0.5||mu>1.3) warn.push("Hệ số μ nằm ngoài khoảng thường gặp, hãy kiểm tra lại I<sub>P</sub>.");
  return {warn,res:[["S<sub>u</sub> đo",fmt(Su,2)+" kPa",""],["μ",fmt(mu,3),"Hệ số hiệu chỉnh"],["S<sub>u,tk</sub>",fmt(Sut,2)+" kPa","= μ × S<sub>u</sub>"]].concat(isNaN(St)?[]:[["Độ nhạy S<sub>t</sub>",fmt(St,2),St>4?"Đất khá nhạy":"Độ nhạy thấp đến vừa"]]),
   steps:[`Đổi đơn vị: T = ${fmt(n.T)} N·m = ${fmt(T,5)} kN·m; D = ${fmt(D,3)} m; H = ${fmt(H,3)} m.`,`Mẫu số: π D² (H + D/3) = 3,1416 × ${fmt(D,3)}² × (${fmt(H,3)} + ${fmt(D,3)}/3) = 3,1416 × ${fmt(D*D,5)} × ${fmt(H+D/3,4)} = ${fmt(den,6)} m³.`,`Cường độ cắt cánh: S<sub>u</sub> = {{2T|π D² (H + D/3)}} = {{2 × ${fmt(T,5)}|${fmt(den,6)}}} = <b>${fmt(Su,2)} kPa</b>.`,`Hệ số hiệu chỉnh: μ = 1,7 − 0,54 × lg(${fmt(n.Ip)}) = 1,7 − 0,54 × ${fmt(lg(n.Ip),3)} = <b>${fmt(mu,3)}</b>.`,`Giá trị thiết kế: S<sub>u,tk</sub> = μ × S<sub>u</sub> = ${fmt(mu,3)} × ${fmt(Su,2)} = <b>${fmt(Sut,2)} kPa</b>.`].concat(isNaN(St)?[]:[`Độ nhạy: S<sub>t</sub> = T / T<sub>r</sub> = ${fmt(n.T)} / ${fmt(Tr)} = <b>${fmt(St,2)}</b> (độ nhạy cao nghĩa là đất mất cường độ nhiều khi bị xáo trộn).`])};
 }},
/* ---- 8. Asaoka ---- */
{id:"asaoka",title:"Dự báo lún cuối cùng bằng Asaoka",desc:"Dán số liệu lún đo được (cách đều thời gian) để tìm β<sub>0</sub>, β<sub>1</sub>, S<sub>∞</sub> và độ cố kết hiện tại.",topics:["m2t4"],
 fields:[AREA("data","Số liệu lún (cm), mỗi giá trị một dòng hoặc cách nhau dấu cách","0\n17.3\n31.0\n41.6\n50.3\n57.0\n62.3\n66.6\n70.0\n72.8\n75.0\n76.9\n78.3","Các thời điểm quan trắc phải cách đều nhau"),F_("dt","Khoảng thời gian giữa hai lần đo, Δt",30,"ngày")],
 syms:[["S<sub>i</sub>","Độ lún tại lần đo thứ i."],["S<sub>i−1</sub>","Độ lún lần đo ngay trước đó."],["β<sub>0</sub>, β<sub>1</sub>","Tung độ gốc và độ dốc của đường hồi quy S<sub>i</sub> theo S<sub>i−1</sub>."],["S<sub>∞</sub>","Độ lún cuối cùng = β<sub>0</sub> / (1 − β<sub>1</sub>)."],["R²","Hệ số xác định; càng gần 1 thì các điểm càng nằm gần một đường thẳng."]],
 compute(v){
  const d=parseList(v.data), dt=num(v.dt);
  if(d.length<4) return {err:"Cần ít nhất 4 giá trị lún."}; if(isNaN(dt)||dt<=0) return {err:"Δt phải là số lớn hơn 0."};
  const r=asaoka(d); if(!r) return {err:"Các giá trị lún không đổi, không hồi quy được."};
  const warn=[]; if(r.b1>=1) warn.push("β<sub>1</sub> ≥ 1: số liệu chưa có xu hướng ổn định, chưa dự báo được S<sub>∞</sub>."); if(r.r2<0.98) warn.push("R² nhỏ hơn 0,98: các điểm chưa nằm gần một đường thẳng, kết quả kém tin cậy.");
  const last=d[d.length-1], Sinf=r.Sinf, U=last/Sinf, k=-ln(r.b1)/dt; let tr=NaN; if(r.b1>0&&r.b1<1&&last<0.9*Sinf) tr=ln((Sinf-last)/(0.1*Sinf))/k;
  const mx=Math.max(Sinf||0,...d)*1.05, line=[[0,r.b0],[mx,r.b0+r.b1*mx]];
  return {warn,res:[["β<sub>0</sub>",fmt(r.b0,3)+" cm",""],["β<sub>1</sub>",fmt(r.b1,4),""],["S<sub>∞</sub>",fmt(Sinf,1)+" cm","Lún cuối cùng dự báo"],["Đã lún",isFinite(U)?pct(U):"—","Lún hiện tại / S<sub>∞</sub>"],["R²",fmt(r.r2,4),""]].concat(isNaN(tr)?[]:[["Còn đến 90%",fmt(tr,0)+" ngày","thời gian còn lại để đạt 90% S<sub>∞</sub>"]]),
   steps:[`Lập ${r.n} cặp (S<sub>i−1</sub>, S<sub>i</sub>) từ ${d.length} số liệu: (${d[0]}; ${d[1]}), (${d[1]}; ${d[2]}), ...`,`Hồi quy tuyến tính S<sub>i</sub> = β<sub>0</sub> + β<sub>1</sub> S<sub>i−1</sub>: β<sub>1</sub> = <b>${fmt(r.b1,4)}</b>, β<sub>0</sub> = <b>${fmt(r.b0,3)} cm</b>, R² = ${fmt(r.r2,4)}.`,`Lún cuối cùng: S<sub>∞</sub> = {{β<sub>0</sub>|1 − β<sub>1</sub>}} = {{${fmt(r.b0,3)}|1 − ${fmt(r.b1,4)}}} = <b>${fmt(Sinf,2)} cm</b>.`,`Độ cố kết hiện tại: U = lún hiện tại / S<sub>∞</sub> = ${fmt(last)} / ${fmt(Sinf,1)} = <b>${isFinite(U)?pct(U):"—"}</b>; lún dư còn lại ≈ ${fmt(Sinf-last,1)} cm.`,`Hằng số thời gian: k = −ln(β<sub>1</sub>) / Δt = ${fmt(k,5)} /ngày${isNaN(tr)?"":`; để đạt 90% S<sub>∞</sub> cần thêm ≈ ln[(S<sub>∞</sub> − S hiện tại)/(0,1 S<sub>∞</sub>)] / k = <b>${fmt(tr,0)} ngày</b>`}.`,`Nên chạy lại khi có thêm số liệu và chỉ dùng phần số liệu sau khi đắp xong.`],
   chart:chart({x0:0,x1:mx,y0:0,y1:mx,xl:"S(i−1) (cm)",yl:"S(i) (cm)",alt:"Đồ thị Asaoka",series:[{name:"S(i) = S(i−1)",cls:"ln",pts:[[0,0],[mx,mx]]},{name:"Hồi quy",cls:"ac",pts:line},{name:"Số liệu",dots:true,pts:d.slice(0,-1).map((x,i)=>[x,d[i+1]])}],marks:[{x:Sinf,y:Sinf,label:"S∞ = "+fmt(Sinf,1)+" cm"}]})};
 }},
/* ---- 9. Hyperbolic ---- */
{id:"hyper",title:"Dự báo lún cuối cùng bằng phương pháp Hyperbolic",desc:"Dán cặp số liệu (ngày, lún) để tìm α, β và S<sub>∞</sub>.",topics:["m2t4"],
 fields:[AREA("data","Số liệu: mỗi dòng gồm thời gian (ngày) và lún (cm)","0 0\n30 17.3\n60 31.0\n90 41.6\n120 50.3\n150 57.0\n180 62.3\n210 66.6\n240 70.0\n270 72.8\n300 75.0\n330 76.9\n360 78.3","Cách nhau dấu cách; không bắt buộc cách đều thời gian"),F_("k0","Bắt đầu tính từ dòng số",1,"","Dòng này chọn làm (t₀, S₀): thường là lúc vừa đắp xong")],
 syms:[["t<sub>0</sub>, S<sub>0</sub>","Thời điểm và độ lún của dòng được chọn làm gốc."],["α, β","Tung độ gốc và độ dốc của đường thẳng (t − t₀)/(S − S₀) theo (t − t₀)."],["S<sub>∞</sub>","Lún cuối cùng = S<sub>0</sub> + 1/β."]],
 compute(v){
  const rows=parseRows(v.data), k0=Math.round(num(v.k0))-1; if(rows.length<4) return {err:"Cần ít nhất 4 dòng số liệu (thời gian, lún)."};
  if(isNaN(k0)||k0<0||k0>rows.length-3) return {err:"Dòng bắt đầu phải nằm trong khoảng từ 1 đến "+(rows.length-2)+"."};
  const ts=rows.map(r=>r[0]), ss=rows.map(r=>r[1]), r=hyper(ts,ss,k0); if(!r) return {err:"Không hồi quy được; kiểm tra số liệu."};
  const warn=[]; if(!(r.beta>0)) warn.push("Độ dốc β không dương: số liệu chưa phù hợp để dự báo."); if(r.r2<0.98) warn.push("R² nhỏ hơn 0,98: các điểm chưa nằm gần một đường thẳng.");
  const tmax=Math.max(...ts)*1.3, fit=Array.from({length:61},(_,i)=>{const t=r.t0+(i/60)*(tmax-r.t0);return [t,r.S0+(t-r.t0)/(r.alpha+r.beta*(t-r.t0))];});
  const cur=ss[ss.length-1];
  return {warn,res:[["α",fmt(r.alpha,4),"ngày/cm"],["β",fmt(r.beta,5),"1/cm"],["S<sub>∞</sub>",fmt(r.Sinf,1)+" cm","Lún cuối cùng dự báo"],["Đã lún",isFinite(r.Sinf)?pct(cur/r.Sinf):"—","Lún hiện tại / S<sub>∞</sub>"],["R²",fmt(r.r2,4),""]],
   steps:[`Gốc: t<sub>0</sub> = ${fmt(r.t0)} ngày, S<sub>0</sub> = ${fmt(r.S0)} cm (dòng số ${k0+1}).`,`Với mỗi dòng sau đó tính y = (t − t<sub>0</sub>)/(S − S<sub>0</sub>) và x = t − t<sub>0</sub>, rồi hồi quy y theo x.`,`Kết quả: α = ${fmt(r.alpha,4)} (tung độ gốc), β = ${fmt(r.beta,5)} (độ dốc), R² = ${fmt(r.r2,4)}.`,`Lún cuối cùng: S<sub>∞</sub> = S<sub>0</sub> + {{1|β}} = ${fmt(r.S0)} + {{1|${fmt(r.beta,5)}}} = <b>${fmt(r.Sinf,2)} cm</b>.`,`Hãy so sánh kết quả này với Asaoka. Nếu hai kết quả lệch nhau nhiều thì dự báo còn chưa chắc.`],
   chart:chart({x0:0,x1:tmax,y0:0,y1:Math.max(r.Sinf||0,cur)*1.1,rev:true,xl:"Thời gian (ngày)",yl:"Lún (cm)",alt:"Dự báo Hyperbolic",series:[{name:"Đường dự báo",cls:"ac",pts:fit},{name:"Số liệu",dots:true,pts:rows.map(r=>[r[0],r[1]])}],hl:[{y:r.Sinf,cls:"rd"}],marks:[]})};
 }},
/* ---- 10. Khối lượng ---- */
{id:"fill",title:"Khối lượng đắp bù lún và đắp gia tải",desc:"Tính diện tích mặt cắt hình thang và thể tích đất của phần bù lún, phần gia tải.",topics:["m2t3"],
 fields:[F_("a","Bề rộng mặt nền thiết kế, a",12,"m"),F_("m","Hệ số mái dốc, m",1.5,"","Mái 1:1,5 thì m = 1,5"),F_("S","Độ lún cần bù, S",0.8,"m"),F_("hg","Chiều cao đắp gia tải, h_g",1,"m"),F_("L","Chiều dài đoạn nền, L",100,"m"),F_("K","Hệ số đầm nén, K",1,"","Theo định mức nếu có; 1,00 là không hiệu chỉnh")],
 syms:[["a","Bề rộng mặt nền (m) tại đỉnh của phần đắp."],["m","Hệ số mái dốc (ngang/đứng)."],["S","Độ lún cần bù; cũng là chiều cao lớp đắp bù lún."],["h<sub>g</sub>","Chiều cao phần gia tải đặt trên cùng."],["L","Chiều dài đoạn nền tính khối lượng."],["K","Hệ số đầm nén theo định mức; khối lượng đất cần đào đắp = thể tích × K."]],
 compute(v){

  const b=n.a+2*n.m*n.S, A1=(n.a+b)/2*n.S, V1=A1*n.L, A2=(n.a+n.m*n.hg)*n.hg, V2=A2*n.L;
  return {res:[["Đắp bù lún",fmt(V1,0)+" m³","diện tích "+fmt(A1,2)+" m²"],["Đắp gia tải",fmt(V2,0)+" m³","diện tích "+fmt(A2,2)+" m²"],["Bù lún × K",fmt(V1*n.K,0)+" m³",""],["Gia tải × K",fmt(V2*n.K,0)+" m³","phần này dỡ đi"]],
   steps:[`Bề rộng đáy lớp bù lún: b = a + 2 m S = ${fmt(n.a)} + 2 × ${fmt(n.m)} × ${fmt(n.S)} = <b>${fmt(b,3)} m</b>.`,`Diện tích mặt cắt hình thang: A<sub>bù</sub> = {{a + b|2}} × S = {{${fmt(n.a)} + ${fmt(b,3)}|2}} × ${fmt(n.S)} = <b>${fmt(A1,3)} m²</b>.`,`Thể tích: V<sub>bù</sub> = A<sub>bù</sub> × L = ${fmt(A1,3)} × ${fmt(n.L)} = <b>${fmt(V1,1)} m³</b>; nhân hệ số đầm nén K = ${fmt(n.K)} được ${fmt(V1*n.K,1)} m³.`,`Phần gia tải đặt trên lớp bù lún có đỉnh rộng a: A<sub>gt</sub> = (a + m h<sub>g</sub>) × h<sub>g</sub> = (${fmt(n.a)} + ${fmt(n.m)} × ${fmt(n.hg)}) × ${fmt(n.hg)} = <b>${fmt(A2,3)} m²</b>; V<sub>gt</sub> = <b>${fmt(V2,1)} m³</b>.`,`Phần bù lún nằm lại trong nền; phần gia tải được dỡ đi nên có thể tận dụng cho đoạn khác. Đây là khối lượng hình học, khi lập dự toán còn phải xét hao hụt theo định mức.`]};
 }},
/* ---- 11. Nén cố kết ---- */
{id:"oed",title:"Thí nghiệm nén cố kết: C<sub>v</sub>, a<sub>v</sub>, m<sub>v</sub>, E<sub>oed</sub>",desc:"Tính C<sub>v</sub> từ thời gian t<sub>90</sub> (Taylor) hoặc t<sub>50</sub> (Casagrande) và các đặc trưng nén từ hai điểm trên đường cong e – p.",topics:["m8t3"],
 fields:[SEL("md","Phương pháp đọc thời gian",[["t90","Căn bậc hai thời gian (Taylor): dùng t₉₀"],["t50","Log thời gian (Casagrande): dùng t₅₀"]],"t90"),F_("t","Thời gian đọc được, t",9,"phút"),F_("H","Chiều cao mẫu trung bình trong cấp tải, H",2,"cm"),SEL("dr","Thoát nước của mẫu",[["2","Hai mặt (H_dr = H/2)"],["1","Một mặt (H_dr = H)"]],"2"),F_("p1","Áp lực đầu cấp, p₁",100,"kPa"),F_("p2","Áp lực cuối cấp, p₂",200,"kPa"),F_("e1","Hệ số rỗng tại p₁, e₁",1.60),F_("e2","Hệ số rỗng tại p₂, e₂",1.48)],
 syms:[["t<sub>90</sub>, t<sub>50</sub>","Thời gian đạt 90% hoặc 50% cố kết của cấp tải, đọc từ đường cong độ lún – thời gian."],["H<sub>dr</sub>","Chiều dài đường thoát nước trong mẫu (cm)."],["C<sub>v</sub>","Hệ số cố kết = T<sub>v</sub> H<sub>dr</sub>² / t, với T<sub>v</sub> = 0,848 (t<sub>90</sub>) hoặc 0,197 (t<sub>50</sub>)."],["a<sub>v</sub>","Hệ số nén lún = (e<sub>1</sub> − e<sub>2</sub>) / (p<sub>2</sub> − p<sub>1</sub>) (1/kPa)."],["m<sub>v</sub>","Hệ số nén thể tích = a<sub>v</sub> / (1 + e<sub>1</sub>) (1/kPa)."],["E<sub>oed</sub>","Mô đun nén một chiều = 1 / m<sub>v</sub> (kPa)."],["C<sub>c</sub>","Chỉ số nén = (e<sub>1</sub> − e<sub>2</sub>) / lg(p<sub>2</sub>/p<sub>1</sub>), chỉ đúng nếu hai điểm nằm trên đoạn nén nguyên thủy."]],
 compute(v){
  const n=reqNums(v,["t","H","p1","p2","e1","e2"]); if(n.err) return n;
  if(n.t<=0||n.H<=0||n.p1<=0||n.p2<=n.p1) return {err:"t, H, p₁ phải lớn hơn 0 và p₂ phải lớn hơn p₁."};
  if(n.e2>=n.e1) return {err:"e₂ phải nhỏ hơn e₁ (đất bị nén thì hệ số rỗng giảm)."};
  const Hdr=v.dr==="2"?n.H/2:n.H, Tv=v.md==="t90"?0.848:0.197, ts=n.t*60, Cvs=Tv*Hdr*Hdr/ts, Cvy=Cvs*3153.6;
  const av=(n.e1-n.e2)/(n.p2-n.p1), mv=av/(1+n.e1), Eo=1/mv, Cc=(n.e1-n.e2)/lg(n.p2/n.p1);
  return {res:[["C<sub>v</sub>",fmt(Cvs,6)+" cm²/s","= "+fmt(Cvy,2)+" m²/năm"],["a<sub>v</sub>",fmt(av,6)+" 1/kPa",""],["m<sub>v</sub>",fmt(mv,6)+" 1/kPa",""],["E<sub>oed</sub>",fmt(Eo,0)+" kPa","= "+fmt(Eo/1000,2)+" MPa"],["C<sub>c</sub> (hai điểm)",fmt(Cc,3),""]],
   steps:[`Đường thoát nước: ${v.dr==="2"?"mẫu thoát nước hai mặt nên H<sub>dr</sub> = H/2 = "+fmt(n.H)+"/2":"mẫu thoát nước một mặt nên H<sub>dr</sub> = H = "+fmt(n.H)} = <b>${fmt(Hdr,3)} cm</b>.`,`Đổi thời gian: t = ${fmt(n.t)} phút = ${fmt(ts,0)} giây. Nhân tố thời gian dùng: T<sub>v</sub> = ${Tv} (${v.md==="t90"?"U = 90%":"U = 50%"}).`,`Hệ số cố kết: C<sub>v</sub> = {{T<sub>v</sub> × H<sub>dr</sub>²|t}} = {{${Tv} × ${fmt(Hdr,3)}²|${fmt(ts,0)}}} = <b>${fmt(Cvs,6)} cm²/s</b>. Đổi sang m²/năm: × 3 153,6 = <b>${fmt(Cvy,3)} m²/năm</b>.`,`Hệ số nén lún: a<sub>v</sub> = {{e<sub>1</sub> − e<sub>2</sub>|p<sub>2</sub> − p<sub>1</sub>}} = {{${fmt(n.e1)} − ${fmt(n.e2)}|${fmt(n.p2)} − ${fmt(n.p1)}}} = <b>${fmt(av,6)} 1/kPa</b>.`,`Hệ số nén thể tích: m<sub>v</sub> = {{a<sub>v</sub>|1 + e<sub>1</sub>}} = {{${fmt(av,6)}|${fmt(1+n.e1,3)}}} = <b>${fmt(mv,6)} 1/kPa</b>; mô đun nén một chiều E<sub>oed</sub> = 1 / m<sub>v</sub> = <b>${fmt(Eo,0)} kPa</b>.`,`Chỉ số nén (nếu hai điểm thuộc đoạn nén nguyên thủy): C<sub>c</sub> = {{e<sub>1</sub> − e<sub>2</sub>|lg(p<sub>2</sub>/p<sub>1</sub>)}} = {{${fmt(n.e1-n.e2,3)}|${fmt(lg(n.p2/n.p1),4)}}} = <b>${fmt(Cc,3)}</b>.`,`Nhớ rằng C<sub>v</sub> của mỗi cấp tải khác nhau; chọn giá trị tương ứng khoảng ứng suất sau khi đắp chứ không lấy cấp tải bất kỳ.`]};
 }},
/* ---- 12. Ba trục ---- */
{id:"tri",title:"Nén ba trục: c<sub>u</sub> (UU) và φ′ (CU có đo áp lực nước lỗ rỗng)",desc:"Từ áp lực buồng, độ lệch ứng suất lúc phá hoại và áp lực nước lỗ rỗng tính c<sub>u</sub>, các ứng suất hữu hiệu và φ′ (giả thiết c′ = 0).",topics:["m8t4"],
 fields:[F_("s3","Áp lực buồng, σ₃",100,"kPa"),F_("qf","Độ lệch ứng suất lúc phá hoại, (σ₁ − σ₃)_f",70,"kPa"),F_("uf","Áp lực nước lỗ rỗng lúc phá hoại, u_f",30,"kPa","Chỉ có ở thí nghiệm CU có đo áp lực nước lỗ rỗng")],
 syms:[["σ<sub>3</sub>","Áp lực buồng (ứng suất chính nhỏ nhất, tổng)."],["(σ<sub>1</sub> − σ<sub>3</sub>)<sub>f</sub>","Độ lệch ứng suất lớn nhất lúc mẫu bị phá hoại."],["u<sub>f</sub>","Áp lực nước lỗ rỗng lúc phá hoại (kPa)."],["c<sub>u</sub>","Cường độ không thoát nước = độ lệch ứng suất / 2 (với φ<sub>u</sub> = 0)."],["σ′<sub>1</sub>, σ′<sub>3</sub>","Ứng suất chính hữu hiệu = ứng suất tổng − u<sub>f</sub>."],["φ′","Góc ma sát trong hữu hiệu: sin φ′ = (σ′<sub>1</sub> − σ′<sub>3</sub>) / (σ′<sub>1</sub> + σ′<sub>3</sub>) khi c′ = 0."]],
 compute(v){
  const n=reqNums(v,["s3","qf","uf"]); if(n.err) return n;
  if(n.s3<=0||n.qf<=0||n.uf<0) return {err:"σ₃ và độ lệch ứng suất phải lớn hơn 0; u_f không âm."};
  const cu=n.qf/2, s1=n.s3+n.qf, s3p=n.s3-n.uf, s1p=s1-n.uf, warn=[];
  if(s3p<=0) return {err:"σ′₃ = σ₃ − u_f ≤ 0: áp lực nước lỗ rỗng quá lớn so với áp lực buồng, kiểm tra số liệu."};
  const sin=(s1p-s3p)/(s1p+s3p), phi=Math.asin(sin)*180/Math.PI;
  warn.push("Giả thiết c′ = 0 và chỉ có một mẫu. Thí nghiệm thật cần ít nhất 3 mẫu ở các áp lực buồng khác nhau, vẽ các vòng tròn Mohr rồi kẻ đường bao để tìm c′ và φ′.");
  return {warn,res:[["c<sub>u</sub> (UU)",fmt(cu,1)+" kPa","= độ lệch / 2"],["σ<sub>1</sub>",fmt(s1,1)+" kPa","= σ₃ + độ lệch"],["σ′<sub>1</sub>, σ′<sub>3</sub>",fmt(s1p,1)+"; "+fmt(s3p,1)+" kPa","trừ u<sub>f</sub>"],["φ′ (c′ = 0)",fmt(phi,1)+" °",""]],
   steps:[`Cường độ không thoát nước: c<sub>u</sub> = {{(σ<sub>1</sub> − σ<sub>3</sub>)<sub>f</sub>|2}} = {{${fmt(n.qf)}|2}} = <b>${fmt(cu,2)} kPa</b>. Đường kính vòng tròn Mohr chính bằng độ lệch ứng suất, nên bán kính là c<sub>u</sub>.`,`Ứng suất chính lớn nhất (tổng): σ<sub>1</sub> = σ<sub>3</sub> + (σ<sub>1</sub> − σ<sub>3</sub>)<sub>f</sub> = ${fmt(n.s3)} + ${fmt(n.qf)} = <b>${fmt(s1,2)} kPa</b>.`,`Ứng suất hữu hiệu: σ′<sub>3</sub> = σ<sub>3</sub> − u<sub>f</sub> = ${fmt(n.s3)} − ${fmt(n.uf)} = <b>${fmt(s3p,2)} kPa</b>; σ′<sub>1</sub> = σ<sub>1</sub> − u<sub>f</sub> = ${fmt(s1,2)} − ${fmt(n.uf)} = <b>${fmt(s1p,2)} kPa</b>.`,`Góc ma sát hữu hiệu (c′ = 0): sin φ′ = {{σ′<sub>1</sub> − σ′<sub>3</sub>|σ′<sub>1</sub> + σ′<sub>3</sub>}} = {{${fmt(s1p-s3p,2)}|${fmt(s1p+s3p,2)}}} = ${fmt(sin,4)}, suy ra φ′ = <b>${fmt(phi,2)}°</b>.`,`Lưu ý: UU cho c<sub>u</sub> dùng cho tính ngắn hạn; CU có đo áp lực nước lỗ rỗng cho c′, φ′ dùng cho tính lâu dài hoặc đắp theo giai đoạn.`]};
 }},
/* ---- 13. CPT ---- */
{id:"cpt",title:"Xuyên tĩnh CPT/CPTu: c<sub>u</sub> và tỷ số ma sát",desc:"Từ sức kháng mũi hiệu chỉnh q<sub>t</sub> và ma sát thành f<sub>s</sub> tính c<sub>u</sub> và tỷ số ma sát R<sub>f</sub>.",topics:["m8t6"],
 fields:[F_("qt","Sức kháng mũi hiệu chỉnh, q_t",400,"kPa"),F_("fs","Ma sát thành đơn vị, f_s",6,"kPa"),F_("sv0","Ứng suất tổng thẳng đứng tại độ sâu đó, σ_v0",40,"kPa"),F_("Nk","Hệ số mũi xuyên, N_kt",15,"","Thường chọn khoảng 10–20, cần hiệu chỉnh theo thí nghiệm khác (như cắt cánh) ở khu vực")],
 syms:[["q<sub>t</sub>","Sức kháng mũi đã hiệu chỉnh theo áp lực nước lỗ rỗng sau mũi (kPa)."],["f<sub>s</sub>","Ma sát đơn vị ở thành ống xuyên (kPa)."],["R<sub>f</sub>","Tỷ số ma sát = f<sub>s</sub> / q<sub>t</sub> × 100 (%). Sét thường có R<sub>f</sub> lớn hơn cát."],["σ<sub>v0</sub>","Ứng suất tổng thẳng đứng tại độ sâu đo (kPa)."],["N<sub>kt</sub>","Hệ số mũi xuyên thực nghiệm."],["c<sub>u</sub>","Cường độ không thoát nước ước tính = (q<sub>t</sub> − σ<sub>v0</sub>) / N<sub>kt</sub>."]],
 compute(v){
  const n=reqNums(v,["qt","fs","sv0","Nk"]); if(n.err) return n;
  if(n.qt<=0||n.fs<0||n.sv0<0||n.Nk<=0) return {err:"q_t và N_kt phải lớn hơn 0; f_s, σ_v0 không âm."};
  if(n.qt<=n.sv0) return {err:"q_t phải lớn hơn σ_v0 để tính c_u."};
  const cu=(n.qt-n.sv0)/n.Nk, Rf=n.fs/n.qt*100;
  return {warn:["Giá trị N<sub>kt</sub> rất ảnh hưởng đến kết quả; nên hiệu chỉnh bằng cắt cánh hoặc nén ba trục UU ở cùng khu vực."],res:[["c<sub>u</sub> ước tính",fmt(cu,1)+" kPa",""],["R<sub>f</sub>",fmt(Rf,2)+" %","Tỷ số ma sát"],["q<sub>t</sub> − σ<sub>v0</sub>",fmt(n.qt-n.sv0,1)+" kPa","Sức kháng mũi thuần"]],
   steps:[`Sức kháng mũi thuần: q<sub>t</sub> − σ<sub>v0</sub> = ${fmt(n.qt)} − ${fmt(n.sv0)} = <b>${fmt(n.qt-n.sv0,2)} kPa</b>.`,`Cường độ không thoát nước: c<sub>u</sub> = {{q<sub>t</sub> − σ<sub>v0</sub>|N<sub>kt</sub>}} = {{${fmt(n.qt-n.sv0,2)}|${fmt(n.Nk)}}} = <b>${fmt(cu,2)} kPa</b>.`,`Tỷ số ma sát: R<sub>f</sub> = {{f<sub>s</sub>|q<sub>t</sub>}} × 100 = {{${fmt(n.fs)}|${fmt(n.qt)}}} × 100 = <b>${fmt(Rf,2)} %</b>.`,`Cách đọc: R<sub>f</sub> lớn (khoảng vài phần trăm trở lên) kết hợp q<sub>t</sub> nhỏ thường là dấu hiệu của sét yếu; R<sub>f</sub> nhỏ và q<sub>t</sub> lớn thường là cát. Dùng biểu đồ phân loại hành vi đất của tiêu chuẩn để kết luận.`]};
 }},
/* ---- 14. Tấm nén ---- */
{id:"plate",title:"Thí nghiệm nén tải trọng tấm: mô đun biến dạng E",desc:"Từ áp lực, đường kính tấm và độ lún tính mô đun biến dạng của nền.",topics:["m8t7"],
 fields:[F_("p","Áp lực lên tấm, p",100,"kPa"),F_("D","Đường kính tấm, D",0.5,"m"),F_("s","Độ lún tương ứng, s",5,"mm"),F_("nu","Hệ số Poisson, ν",0.35,"","Đất sét thường khoảng 0,3–0,45 (chọn theo tiêu chuẩn)"),F_("w","Hệ số hình dạng, ω",0.785,"","Tấm tròn cứng: π/4 ≈ 0,785")],
 syms:[["p","Áp lực tác dụng lên tấm (kPa); nên lấy trong đoạn gần thẳng của đường p – s."],["D","Đường kính tấm tròn (m)."],["s","Độ lún của tấm ứng với p (m; nhập bằng mm)."],["ν","Hệ số Poisson của đất."],["ω","Hệ số hình dạng; tấm tròn cứng ω = π/4."],["E","Mô đun biến dạng = ω (1 − ν²) p D / s."]],
 compute(v){
  const n=reqNums(v,["p","D","s","nu","w"]); if(n.err) return n;
  if(n.p<=0||n.D<=0||n.s<=0||n.w<=0||n.nu<0||n.nu>=0.5) return {err:"p, D, s, ω phải lớn hơn 0 và ν nằm trong khoảng 0–0,5."};
  const s=n.s/1000, E=n.w*(1-n.nu*n.nu)*n.p*n.D/s;
  return {res:[["E",fmt(E,0)+" kPa","= "+fmt(E/1000,2)+" MPa"]],
   steps:[`Đổi đơn vị: s = ${fmt(n.s)} mm = ${fmt(s,4)} m.`,`Hệ số: ω (1 − ν²) = ${fmt(n.w,3)} × (1 − ${fmt(n.nu,2)}²) = ${fmt(n.w,3)} × ${fmt(1-n.nu*n.nu,4)} = ${fmt(n.w*(1-n.nu*n.nu),4)}.`,`E = ω (1 − ν²) × {{p × D|s}} = ${fmt(n.w*(1-n.nu*n.nu),4)} × {{${fmt(n.p)} × ${fmt(n.D)}|${fmt(s,4)}}} = <b>${fmt(E,0)} kPa</b> (≈ ${fmt(E/1000,2)} MPa).`,`Kết quả chỉ đại diện cho vùng đất nông dưới tấm (khoảng 1,5–2 lần đường kính tấm). Không dùng trực tiếp cho lớp đất yếu nằm sâu hơn.`]};
 }},
/* ---- 15. Đổi đơn vị ---- */
{id:"unit",title:"Đổi đơn vị địa kỹ thuật",desc:"Đổi C<sub>v</sub> (cm²/s, m²/năm...), áp suất, dung trọng, hệ số nén lún.",topics:["m1t4","m7t1"],
 fields:[F_("val","Giá trị cần đổi",1),SEL("from","Từ đơn vị",UNITS_OPTS(),"cv_cm2s")],
 syms:[["C<sub>v</sub>","Hệ số cố kết; 1 cm²/s = 3 153,6 m²/năm (365 ngày)."],["kg/cm²","Là kgf/cm²; 1 kg/cm² ≈ 98,07 kPa."],["T/m²","Là tấn lực trên m²; 1 T/m² ≈ 9,807 kPa."],["g/cm³","Khối lượng riêng; nhân với 9,807 được dung trọng kN/m³."],["a<sub>v</sub>","Hệ số nén lún; 1 cm²/kg ≈ 0,0102 1/kPa."]],
 compute(v){
  const n=reqNums(v,["val"]); if(n.err) return n;
  const u=UNITS.find(x=>x.id===v.from); if(!u) return {err:"Chọn đơn vị cần đổi."};
  const base=n.val*u.f, rows=UNITS.filter(x=>x.cat===u.cat);
  return {res:rows.map(r=>[r.lab,fmt(base/r.f,6),r.id===u.id?"đơn vị gốc":""]),steps:[`Nhóm đại lượng: <b>${u.cat.replace("_","")}</b>. Quy về đơn vị chuẩn của nhóm (${rows.find(r=>r.f===1).lab}): ${fmt(n.val)} ${u.lab} × ${fmt(u.f,6)} = ${fmt(base,6)}.`,`Mỗi kết quả bên trên bằng giá trị chuẩn chia cho hệ số quy đổi của đơn vị đó.`]};
 }}

const GMAP = {}; GLOSS.forEach(g=>{ g.key = gkey(g[0]); GMAP[g.key] = g; });
function glossLink(sym){

/* ============ TRANG MÁY TÍNH ============ */
function fieldHtml(prefix,f,val){
  const id = `${prefix}_${f.k}`, lab = subs(f.lab) + (f.unit?` <i>(${f.unit})</i>`:""), hint = f.hint?`<span class="fh">${subs(f.hint)}</span>`:"";
  if(f.type==="select") return `<label class="fld" for="${id}"><span class="fl">${lab}</span><select id="${id}" data-k="${f.k}">${f.opts.map(o=>`<option value="${o[0]}"${String(o[0])===String(val)?" selected":""}>${subs(o[1])}</option>`).join("")}</select>${hint}</label>`;
  if(f.type==="area") return `<label class="fld wide" for="${id}"><span class="fl">${lab}</span><textarea id="${id}" data-k="${f.k}" rows="8" spellcheck="false">${esc(val)}</textarea>${hint}</label>`;
  return `<label class="fld" for="${id}"><span class="fl">${lab}</span><input id="${id}" data-k="${f.k}" type="text" inputmode="decimal" autocomplete="off" value="${esc(val)}">${hint}</label>`;
}
function readVals(root,fields){ const o={}; fields.forEach(f=>{ const el=root.querySelector(`[data-k="${f.k}"]`); o[f.k]=el?el.value:""; }); return o; }
function renderCalcIndex(){
  currentId=null;
  let h=`<div class="titleblock" style="--mc:${toolMc}"><h2>Máy tính nhanh</h2><p class="lead"><b>Cách dùng:</b> chọn một máy tính, đổi số liệu và kết quả cùng các bước tính hiện ra ngay. Giá trị mặc định là ví dụ có sẵn trong các bài học, nên bạn có thể đối chiếu ngay với phần ví dụ.</p></div><div class="toolgrid">`;
  CALCS.forEach(c=>{ h+=`<a class="tcard" style="--mc:${toolMc}" href="#tool/calc/${c.id}"><h3>${c.title}</h3><p>${c.desc}</p></a>`; });
  $("#main").innerHTML=fx(h+"</div>"); renderTree(); window.scrollTo(0,0);
}
function renderCalc(id){
  const c=CALCS.find(x=>x.id===id); if(!c) return renderCalcIndex();
  currentId=null; state.calc=state.calc||{};
  const saved=state.calc[id]||{}, vals={}; c.fields.forEach(f=>{ vals[f.k]=saved[f.k]!==undefined?saved[f.k]:f.def; });
  let h=`<div style="--mc:${toolMc}"><div class="crumb"><a href="#tool/calc">Máy tính nhanh</a> · <b>${c.id==="unit"?"Đổi đơn vị":"Máy tính"}</b></div>
   <div class="titleblock"><h2>${c.title}</h2><p class="lead">${c.desc}</p></div>`;
  h+=sec("Giá trị đầu vào",`<div class="form">${c.fields.map(f=>fieldHtml("c_"+c.id,f,vals[f.k])).join("")}</div><div class="row"><button class="btn ghost small" id="cReset">Về giá trị mẫu</button></div>`);
  h+=sec("Kết quả",`<div id="cOut"></div>`);
  h+=sec("Các bước tính",`<ol class="steps" id="cSteps"></ol>`);
  h+=sec("Giải thích ký hiệu",`<div class="tblwrap"><table>${c.syms.map(s=>`<tr><td class="k">${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table></div>`);
  if(c.topics) h+=sec("Xem thêm trong bài học",`<ul class="plain">${c.topics.map(t=>{const x=ALL.find(a=>a.t.id===t);return x?`<li><a href="#${t}">${x.t.title}</a></li>`:"";}).join("")}</ul>`);
  h+=`<div class="nav2"><a class="btn ghost" href="#tool/calc" style="text-decoration:none">← Các máy tính khác</a></div></div>`;
  const root=$("#main"); root.innerHTML=fx(h);
  const out=$("#cOut"), stp=$("#cSteps");
  function update(){
    const v=readVals(root,c.fields); state.calc[id]=v; save();
    let r; try{ r=c.compute(v); }catch(e){ r={err:"Có lỗi khi tính: "+e.message}; }
    if(r.err){ out.innerHTML=`<div class="callout mist"><span class="lb">Chưa tính được</span>${r.err}</div>`; stp.innerHTML=""; return; }
    out.innerHTML=fx((r.warn||[]).map(w=>`<div class="callout note"><span class="lb">Lưu ý</span>${w}</div>`).join("")+`<div class="reslist">${r.res.map(x=>`<div class="res"><span>${x[0]}</span><b>${x[1]}</b><span>${x[2]||""}</span></div>`).join("")}</div>`+(r.chart?`<figure class="fig">${r.chart}</figure>`:""));
    stp.innerHTML=fx(r.steps.map(s=>`<li>${s}</li>`).join(""));
  }
  root.addEventListener("input",update); root.addEventListener("change",update);
  $("#cReset").onclick=()=>{ c.fields.forEach(f=>{ const el=root.querySelector(`[data-k="${f.k}"]`); if(el) el.value=f.def; }); update(); };
  update(); renderTree(); window.scrollTo(0,0);
}

function renderGloss(key){
  currentId=null;
  const groups=[...new Set(GLOSS.map(g=>g[5]))];
  let h=`<div class="titleblock" style="--mc:${toolMc}"><h2>Từ điển ký hiệu và thuật ngữ</h2><p class="lead"><b>${GLOSS.length} mục.</b> Trong các bài học, ký hiệu có gạch chân chấm có thể bấm để nhảy tới đây. Gõ vào ô tìm kiếm để lọc.</p></div>
   <input class="search" id="gq" type="search" placeholder="Tìm ký hiệu hoặc thuật ngữ, ví dụ Cv, bấc thấm, cố kết..."><div id="gl"></div>`;
  $("#main").innerHTML=fx(h);
  function draw(){
    const q=plain($("#gq").value||"").trim(); let o="";
    groups.forEach(gr=>{
      const items=GLOSS.filter(g=>g[5]===gr&&(!q||plain(g.slice(0,4).join(" ")).includes(q)));
      if(!items.length) return;
      o+=`<section class="sec" style="--mc:${toolMc}"><h3>${gr}</h3>`+items.map(g=>`<div class="gitem" id="g_${encodeURIComponent(g.key)}"><div class="gsym">${g[0]}</div><div class="gbody"><b>${g[1]}</b>${g[2]?` <span class="small-muted">(${g[2]})</span>`:""}<p>${g[3]}</p><div class="small-muted">${g[4].map(t=>{const x=ALL.find(a=>a.t.id===t);return x?`<a href="#${t}">${x.t.title}</a>`:"";}).filter(Boolean).join(" · ")}</div></div></div>`).join("")+`</section>`;
    });
    $("#gl").innerHTML=fx(o||`<p class="small-muted">Không tìm thấy mục nào khớp.</p>`);
  }
  $("#gq").oninput=draw; draw();
  if(key){ const el=document.getElementById("g_"+encodeURIComponent(key)); if(el){ el.classList.add("hit"); setTimeout(()=>el.scrollIntoView({block:"center"}),60); } else window.scrollTo(0,0); } else window.scrollTo(0,0);
  renderTree();
}

  formulas:[
   {name:"Hệ số rỗng từ các chỉ tiêu",f:"e<sub>0</sub> = {{G<sub>s</sub> · γ<sub>w</sub> · (1 + W)|γ}} − 1",symbols:[["e<sub>0</sub>","Hệ số rỗng ban đầu."],["G<sub>s</sub>","Tỷ trọng hạt đất."],["γ<sub>w</sub>","Dung trọng của nước, 9,81 kN/m³."],["W","Độ ẩm tự nhiên dạng số thập phân (48% là 0,48)."],["γ","Dung trọng tự nhiên (kN/m³)."]],cond:"Dùng được khi đất bão hòa. Nếu tính ra độ bão hòa S<sub>r</sub> lệch xa 1 thì có chỉ tiêu bị sai."},
   {name:"Độ bão hòa",f:"S<sub>r</sub> = {{W · G<sub>s</sub>|e<sub>0</sub>}}",symbols:[["S<sub>r</sub>","Độ bão hòa, bằng 1 là bão hòa hoàn toàn."]],cond:"Sét yếu dưới mực nước ngầm thường có S<sub>r</sub> từ 0,95 đến 1."}
  ],
  example:{title:"Ví dụ: kiểm tra một bộ số liệu",html:"<p>Một mẫu sét: W = 48%, W<sub>L</sub> = 50%, W<sub>P</sub> = 26%, γ = 17 kN/m³, G<sub>s</sub> = 2,70.</p><p>I<sub>P</sub> = 50 − 26 = 24. I<sub>L</sub> = (48 − 26)/24 = 0,92, thuộc nhóm dẻo chảy, là đất yếu.</p><p>e<sub>0</sub> = 2,70 × 9,81 × 1,48 / 17 − 1 = 1,306. S<sub>r</sub> = 0,48 × 2,70 / 1,306 = 0,99, ăn khớp với đất bão hòa.</p><p>Bạn có thể kiểm lại bằng <a href=\"#tool/calc/soil\">máy tính chỉ tiêu đất</a>.</p>"},
  notes:["Cách xác định W<sub>L</sub> và W<sub>P</sub> khác nhau giữa các tiêu chuẩn nên khi so sánh số liệu giữa các báo cáo cần xem phương pháp. Cần đối chiếu với tiêu chuẩn mà khảo sát áp dụng."],
  quiz:[["Một mẫu có S_r tính ra bằng 1,3. Điều đó cho biết gì?","Không thể có độ bão hòa lớn hơn 1, nên ít nhất một trong các số W, γ, G_s bị sai hoặc nhầm đơn vị. Cần kiểm tra lại số liệu gốc."]]
 },
 {
  id:"m8t3", title:"Thí nghiệm nén cố kết (oedometer)",
  summary:"Thí nghiệm nén một chiều cho ba nhóm kết quả: độ nén (C<sub>c</sub>, C<sub>s</sub>, σ′<sub>p</sub>), độ cứng (a<sub>v</sub>, m<sub>v</sub>, E<sub>oed</sub>) và tốc độ cố kết (C<sub>v</sub>). Đây là nguồn số liệu chính của bài toán tính lún.",
  concepts:[
   ["Sơ đồ thí nghiệm","Mẫu hình trụ trong vòng thép, đặt giữa hai tấm đá thấm, ngập nước. Tăng tải theo cấp, mỗi cấp giữ 24 giờ (thường nhân đôi tải mỗi cấp), đọc độ lún theo thời gian."],
   ["Đường cong e – lg σ′","Vẽ hệ số rỗng cuối mỗi cấp theo lg áp lực. Đoạn đầu thoải (nén lại), đoạn sau dốc (nén nguyên thủy). Độ dốc đoạn sau là C<sub>c</sub>; điểm gấp khúc cho σ′<sub>p</sub>."],
   ["Phương pháp Taylor (căn thời gian)","Vẽ độ lún theo √t, kẻ đường thẳng có hoành độ lớn gấp 1,15 lần đường thẳng ban đầu; giao điểm cho t<sub>90</sub>. T<sub>v</sub> khi đó bằng 0,848."],
   ["Phương pháp Casagrande (log thời gian)","Vẽ độ lún theo lg t để tìm t<sub>50</sub>, với T<sub>v</sub> = 0,197."],
   ["Hệ số thấm","k = C<sub>v</sub> · m<sub>v</sub> · γ<sub>w</sub>, tính gián tiếp từ kết quả cố kết."]
  ],
  formulas:[
   {name:"Hệ số cố kết từ t<sub>90</sub> (Taylor)",f:"C<sub>v</sub> = {{0,848 · H<sub>dr</sub>²|t<sub>90</sub>}}",symbols:[["C<sub>v</sub>","Hệ số cố kết thẳng đứng (cm²/s)."],["H<sub>dr</sub>","Chiều dài đường thoát nước. Mẫu nén hai mặt thoát thì bằng nửa chiều cao mẫu trung bình của cấp tải."],["t<sub>90</sub>","Thời gian đạt 90% cố kết (giây)."]],cond:"Chiều cao mẫu dùng là giá trị trung bình trong cấp tải đó. Đổi đơn vị cẩn thận: 1 cm²/s ≈ 3 153,6 m²/năm."},
   {name:"Hệ số nén lún và hệ số nén thể tích",f:"a<sub>v</sub> = {{e<sub>1</sub> − e<sub>2</sub>|σ′<sub>2</sub> − σ′<sub>1</sub>}}  ;  m<sub>v</sub> = {{a<sub>v</sub>|1 + e<sub>1</sub>}}  ;  E<sub>oed</sub> = {{1|m<sub>v</sub>}}",symbols:[["e<sub>1</sub>, e<sub>2</sub>","Hệ số rỗng ở đầu và cuối cấp áp lực."],["σ′<sub>1</sub>, σ′<sub>2</sub>","Áp lực hữu hiệu ở đầu và cuối cấp (kPa)."],["a<sub>v</sub>","Hệ số nén lún (1/kPa)."],["m<sub>v</sub>","Hệ số nén thể tích (1/kPa)."],["E<sub>oed</sub>","Mô đun nén một chiều (kPa)."]],cond:"Các giá trị phụ thuộc cấp áp lực; phải chọn cấp tải sát với ứng suất ngoài hiện trường."},
   {name:"Chỉ số nén",f:"C<sub>c</sub> = {{e<sub>1</sub> − e<sub>2</sub>|lg(σ′<sub>2</sub> / σ′<sub>1</sub>)}}",symbols:[["C<sub>c</sub>","Chỉ số nén, độ dốc đoạn nén nguyên thủy trên đồ thị e – lg σ′."]],cond:"Chỉ lấy hai điểm nằm hẳn trên đoạn nén nguyên thủy, sau σ′<sub>p</sub>."}
  ],
  example:{title:"Ví dụ: tính C_v, a_v, E_oed từ một cấp tải",html:"<p>Mẫu cao trung bình 18 mm, thoát nước hai mặt nên H<sub>dr</sub> = 9 mm = 0,9 cm. Taylor cho t<sub>90</sub> = 2 700 giây.</p><p>C<sub>v</sub> = 0,848 × 0,9² / 2 700 = 0,848 × 0,81 / 2 700 = 2,54 × 10⁻⁴ cm²/s (số khác với máy tính mẫu vì khác dữ liệu). Đổi sang m²/năm bằng cách nhân 3 153,6.</p><p>Nếu e<sub>1</sub> = 1,25, e<sub>2</sub> = 1,16 khi áp lực tăng từ 100 lên 200 kPa: a<sub>v</sub> = 0,09/100 = 0,0009 1/kPa; m<sub>v</sub> = 0,0009/2,25 = 0,0004 1/kPa; E<sub>oed</sub> = 2 500 kPa.</p><p>Thử với <a href=\"#tool/calc/oed\">máy tính nén cố kết</a>.</p>"},
  steps:["Kiểm tra mẫu: chiều cao, hệ số rỗng ban đầu, chất lượng (xem bài chất lượng mẫu).","Vẽ đường e – lg σ′ và xác định σ′<sub>p</sub>; đối chiếu với σ′<sub>v0</sub> để biết cố kết thường hay quá cố kết.","Đọc C<sub>c</sub> trên đoạn nén nguyên thủy, C<sub>s</sub> trên đoạn dỡ tải.","Với cấp tải sát ứng suất thực tế, tính C<sub>v</sub> từ t<sub>90</sub> hoặc t<sub>50</sub>.","Đổi đơn vị C<sub>v</sub> đúng trước khi dùng cho bài toán thời gian lún."],
  notes:["C<sub>v</sub> đo trong phòng thường nhỏ hơn giá trị hiện trường (ít kể đến các lớp cát mỏng và khe nứt). Hệ số cho phép hiệu chỉnh cần đối chiếu với khuyến nghị của dự án."],
  quiz:[["Thời gian t_90 càng ngắn thì C_v lớn hay nhỏ?","Lớn. C_v = 0,848·H_dr²/t_90, nên t_90 ngắn nghĩa là nước thoát nhanh, đất cố kết nhanh."],["Vì sao phải biết cấp áp lực khi dùng a_v?","Đường e – lg σ′ cong nên a_v thay đổi theo cấp áp lực. Chỉ dùng được a_v của cấp bao quanh ứng suất thực tế."]]
 },
 {
  id:"m8t4", title:"Thí nghiệm nén ba trục UU, CU, CD",
  summary:"Nén ba trục cho phép chọn điều kiện cố kết và thoát nước, nên cho ra đúng loại sức chống cắt cần cho từng bài toán: c<sub>u</sub> cho ổn định ngắn hạn, c′ và φ′ cho dài hạn.",
  concepts:[
   ["Sơ đồ thí nghiệm","Mẫu trụ bọc màng cao su đặt trong buồng đầy nước. Tạo áp lực buồng σ<sub>3</sub>, sau đó nén dọc trục tăng dần đến khi mẫu phá hoại."],
   ["Ứng suất lệch","q = σ<sub>1</sub> − σ<sub>3</sub>, độ chênh giữa ứng suất dọc trục và áp lực buồng. Giá trị lớn nhất là q<sub>f</sub>."],
   ["UU","Không cố kết, không thoát nước. Nhanh, rẻ. Với sét bão hòa, đường bao Mohr nằm ngang (φ<sub>u</sub> = 0) và c<sub>u</sub> = q<sub>f</sub>/2."],
   ["CU","Cố kết dưới σ<sub>3</sub> rồi cắt không thoát nước, có đo áp lực nước lỗ rỗng u. Dùng ứng suất hữu hiệu σ′ = σ − u để tìm c′, φ′."],
   ["CD","Cố kết và cắt thật chậm cho nước thoát; không phát sinh áp lực nước lỗ rỗng. Cho trực tiếp c′, φ′, nhưng mất nhiều ngày với sét."]
  ],
  formulas:[
   {name:"Cường độ không thoát nước (UU)",f:"c<sub>u</sub> = {{σ<sub>1</sub> − σ<sub>3</sub>|2}} = {{q<sub>f</sub>|2}}",symbols:[["c<sub>u</sub>","Cường độ chống cắt không thoát nước (kPa)."],["σ<sub>1</sub>","Ứng suất chính lớn nhất lúc phá hoại (kPa)."],["σ<sub>3</sub>","Áp lực buồng (kPa)."],["q<sub>f</sub>","Ứng suất lệch lúc phá hoại."]],cond:"Chỉ đúng cho sét bão hòa, khi đường bao Mohr nằm ngang. Mẫu xáo trộn sẽ cho c<sub>u</sub> thấp hơn thực tế."},
   {name:"Góc ma sát hữu hiệu từ một mẫu CU (đất không dính)",f:"sin φ′ = {{σ′<sub>1</sub> − σ′<sub>3</sub>|σ′<sub>1</sub> + σ′<sub>3</sub>}}",symbols:[["σ′<sub>1</sub>, σ′<sub>3</sub>","Ứng suất chính hữu hiệu lúc phá hoại: σ′ = σ − u."],["φ′","Góc ma sát hữu hiệu (độ)."]],cond:"Công thức này giả sử c′ = 0 (đường bao qua gốc). Nếu có c′ phải dùng ít nhất 3 mẫu ở các σ<sub>3</sub> khác nhau để vẽ đường bao chung."}
  ],
  example:{title:"Ví dụ: một mẫu UU và một mẫu CU",html:"<p>UU: σ<sub>3</sub> = 100 kPa, σ<sub>1</sub> lúc phá hoại = 170 kPa. c<sub>u</sub> = (170 − 100)/2 = 35 kPa.</p><p>CU: σ<sub>3</sub> = 200, σ<sub>1</sub> = 320, áp lực nước lỗ rỗng u = 90 kPa. Khi đó σ′<sub>3</sub> = 110, σ′<sub>1</sub> = 230. sin φ′ = (230 − 110)/(230 + 110) = 0,353, φ′ ≈ 20,7° (giả sử c′ = 0).</p><p>Thử số khác với <a href=\"#tool/calc/tri\">máy tính nén ba trục</a>.</p>"},
  steps:["Chọn loại thí nghiệm theo bài toán: ổn định ngắn hạn thì UU hoặc CU; ổn định dài hạn thì CU có đo u hoặc CD.","Dùng ít nhất 3 mẫu từ cùng một lớp, áp lực buồng khác nhau, bao quanh ứng suất thực tế tại độ sâu lấy mẫu.","Vẽ các vòng Mohr (theo ứng suất tổng với UU, theo ứng suất hữu hiệu với CU/CD) và kẻ đường bao chung.","Đọc c, φ (hoặc c′, φ′) từ đường bao; ghi rõ loại thí nghiệm bên cạnh thông số."],
  notes:["Các mô hình CU/UU trong Geoslope được nói ở bài 6.2 và 6.4; khi nhập thông số cần chọn đúng mô hình tương ứng với loại thí nghiệm."],
  quiz:[["Vì sao UU không cho được φ′?","Vì không đo áp lực nước lỗ rỗng và mẫu không cố kết, nên chỉ có ứng suất tổng; với sét bão hòa kết quả là φ_u = 0 và chỉ đọc được c_u."]]
 },
 {
  id:"m8t5", title:"Cắt trực tiếp, nén nở hông và cắt cánh trong phòng",
  summary:"Ba thí nghiệm nhanh, đơn giản, thường dùng để đối chiếu với nén ba trục. Mỗi thí nghiệm có giới hạn riêng mà người đọc cần biết.",
  concepts:[
   ["Cắt trực tiếp","Mẫu đặt trong hộp cắt hai nửa, đặt tải đứng rồi kéo một nửa trượt lên nửa kia. Mặt cắt bị áp đặt nằm ngang. Đo τ<sub>f</sub> tại nhiều tải đứng σ để vẽ τ = c + σ tan φ."],
   ["Tốc độ cắt","Cắt nhanh cho c, φ không thoát nước (không đại diện); cắt chậm đủ để nước thoát cho c′, φ′. Báo cáo phải ghi rõ."],
   ["Nén nở hông (nén một trục)","Nén mẫu không có áp lực buồng. q<sub>u</sub> là ứng suất lớn nhất; c<sub>u</sub> ≈ q<sub>u</sub> / 2. Phù hợp cho sét dính, không dùng cho cát hoặc đất nứt nẻ."],
   ["Cắt cánh phòng, nén kiểu côn rơi","Dụng cụ nhỏ để đo nhanh c<sub>u</sub> của mẫu. Cho kết quả tham khảo, không thay được ba trục."]
  ],
  formulas:[
   {name:"Cường độ từ nén nở hông",f:"c<sub>u</sub> = {{q<sub>u</sub>|2}}",symbols:[["q<sub>u</sub>","Cường độ kháng nén một trục (kPa)."],["c<sub>u</sub>","Cường độ chống cắt không thoát nước."]],cond:"Mẫu mất áp lực buồng nên kết quả thường thấp hơn UU; giá trị mang tính tham khảo."},
   {name:"Sức chống cắt Mohr-Coulomb",f:"τ<sub>f</sub> = c + σ · tan φ",symbols:[["τ<sub>f</sub>","Ứng suất cắt khi phá hoại (kPa)."],["σ","Ứng suất pháp lên mặt cắt (kPa)."],["c, φ","Lực dính và góc ma sát trong (hoặc c′, φ′ nếu dùng ứng suất hữu hiệu)."]],cond:"Cần ít nhất hai (tốt nhất ba) tải đứng khác nhau để xác định đường thẳng."}
  ],
  notes:["Trong cắt trực tiếp không đo được áp lực nước lỗ rỗng và mặt phá hoại bị áp đặt, nên với đất yếu chỉ coi là kết quả bổ sung."],
  quiz:[["Nén nở hông cho thông số gì và dùng cho loại đất nào?","Cho q_u, từ đó c_u ≈ q_u/2. Chỉ dùng cho sét dính bão hòa, không dùng cho cát."]]
 },
 {
  id:"m8t6", title:"Xuyên tiêu chuẩn SPT và xuyên tĩnh CPT, CPTu",
  summary:"SPT và CPT là hai thí nghiệm hiện trường phổ biến nhất. CPT/CPTu cho đường cong liên tục theo độ sâu nên rất hợp để phát hiện lớp yếu mỏng và ước c<sub>u</sub>.",
  concepts:[
   ["SPT","Đóng ống mẫu bằng búa 63,5 kg rơi cao 76 cm. N là số nhát búa cho 30 cm sau (không tính 15 cm đầu). Ưu điểm: lấy được mẫu. Nhược: thô, phụ thuộc thiết bị và người làm."],
   ["CPT","Ấn đầu xuyên hình côn (tiết diện 10 cm²) vào đất với tốc độ 2 cm/s, đo sức kháng mũi q<sub>c</sub> và ma sát thành f<sub>s</sub>. Kết quả liên tục theo độ sâu, lặp lại tốt."],
   ["CPTu","CPT có đầu đo áp lực nước lỗ rỗng u<sub>2</sub> ngay sau mũi. Dùng u<sub>2</sub> để hiệu chỉnh q<sub>c</sub> thành q<sub>t</sub>."],
   ["Hiệu chỉnh mũi xuyên","q<sub>t</sub> = q<sub>c</sub> + u<sub>2</sub> (1 − a), với a là tỷ số diện tích của đầu xuyên (thường 0,6–0,85) theo hiệu chuẩn thiết bị."],
   ["Phân loại đất theo CPT","Sét: q<sub>t</sub> nhỏ, tỷ số ma sát R<sub>f</sub> lớn (khoảng 3–5%) và u<sub>2</sub> cao. Cát: q<sub>t</sub> lớn, R<sub>f</sub> nhỏ (dưới 1%)."],
   ["Thí nghiệm tiêu tán","Dừng đầu xuyên và đo u<sub>2</sub> giảm theo thời gian để ước c<sub>h</sub>."]
  ],
  formulas:[
   {name:"Cường độ không thoát nước từ CPTu",f:"c<sub>u</sub> = {{q<sub>t</sub> − σ<sub>v0</sub>|N<sub>kt</sub>}}",symbols:[["c<sub>u</sub>","Cường độ chống cắt không thoát nước (kPa)."],["q<sub>t</sub>","Sức kháng mũi đã hiệu chỉnh (kPa)."],["σ<sub>v0</sub>","Ứng suất tổng thẳng đứng tại độ sâu đó (kPa)."],["N<sub>kt</sub>","Hệ số mũi xuyên thực nghiệm, thường trong khoảng 10–20."]],cond:"N<sub>kt</sub> phải được hiệu chuẩn theo cắt cánh hoặc ba trục tại cùng khu vực; không dùng một số cố định cho mọi nơi."},
   {name:"Tỷ số ma sát",f:"R<sub>f</sub> = {{f<sub>s</sub>|q<sub>t</sub>}} × 100%",symbols:[["f<sub>s</sub>","Ma sát thành đơn vị (kPa)."],["R<sub>f</sub>","Tỷ số ma sát (%), dùng phân loại đất."]]}
  ],
  example:{title:"Ví dụ: ước c_u từ CPTu",html:"<p>Tại độ sâu 6 m: q<sub>c</sub> = 480 kPa, u<sub>2</sub> = 150 kPa, a = 0,8, σ<sub>v0</sub> = 100 kPa, N<sub>kt</sub> = 15, f<sub>s</sub> = 10 kPa.</p><p>q<sub>t</sub> = 480 + 150 × (1 − 0,8) = 510 kPa. c<sub>u</sub> = (510 − 100)/15 = 27,3 kPa. R<sub>f</sub> = 10/510 = 2,0%.</p><p>Thử với <a href=\"#tool/calc/cpt\">máy tính CPTu</a>.</p>"},
  notes:["SPT trong sét yếu thường cho N rất nhỏ (0–2) nên độ phân giải kém; tương quan N – c<sub>u</sub> chỉ dùng kiểm tra thô.","Ngưỡng N và hệ số N<sub>kt</sub> cụ thể cần đối chiếu với tiêu chuẩn và tài liệu hiệu chuẩn khu vực."],
  quiz:[["Vì sao CPT thích hợp hơn SPT để tìm lớp bùn mỏng xen kẹp?","CPT đo liên tục theo độ sâu (cách mỗi 1–2 cm), còn SPT chỉ đo cách mỗi 1–2 m nên dễ bỏ sót lớp mỏng."]]
 },
 {
  id:"m8t7", title:"Nén tấm, nén ngang, thí nghiệm thấm và các thí nghiệm hiện trường khác",
  summary:"Ngoài SPT, CPT và cắt cánh, còn vài thí nghiệm hiện trường cho độ cứng và tính thấm: nén tấm, pressuremeter, thấm trong lỗ khoan, và thí nghiệm nén dẹt DMT.",
  concepts:[
   ["Nén tấm","Đặt tấm cứng đường kính D lên mặt đất, gia tải từng cấp và đo độ lún s. Cho mô đun biến dạng E của lớp trong phạm vi khoảng 1–2 lần D dưới tấm."],
   ["Pressuremeter (nén ngang)","Bơm áp suất vào khoang cao su trong lỗ khoan, đo biến dạng thành lỗ. Cho mô đun nén ngang và áp lực giới hạn."],
   ["Nén dẹt DMT","Ấn tấm dẹt vào đất, thổi khí đẩy màng thép, đọc áp suất ở hai mức chuyển vị. Cho chỉ số vật liệu và mô đun."],
   ["Thấm trong lỗ khoan","Đổ nước vào hoặc hút nước ra khỏi lỗ khoan và đo mực nước theo thời gian để tính hệ số thấm k."],
   ["Quan trắc mực nước và piezometer","Đặt thiết bị đo áp lực nước lỗ rỗng để biết điều kiện thủy tĩnh, đặc biệt khi có lớp cát kẹp áp lực."]
  ],
  formulas:[
   {name:"Mô đun biến dạng từ thí nghiệm nén tấm",f:"E = ω · (1 − ν²) · {{p · D|s}}",symbols:[["E","Mô đun biến dạng (kPa)."],["ω","Hệ số hình dạng và độ cứng tấm (tấm tròn cứng thường lấy 0,79)."],["ν","Hệ số Poisson của đất."],["p","Áp lực lên tấm trong khoảng đường cong gần thẳng (kPa)."],["D","Đường kính tấm (m)."],["s","Độ lún tương ứng với p (m)."]],cond:"Chỉ lấy đoạn gần tuyến tính của đường p – s. Tấm nhỏ chỉ phản ánh lớp đất nông; không suy ra cho lớp sâu."}
  ],
  example:{title:"Ví dụ: nén tấm",html:"<p>Tấm tròn D = 0,3 m, ω = 0,79, ν = 0,35. Trên đoạn thẳng, p tăng 100 kPa thì s tăng 1 mm = 0,001 m.</p><p>E = 0,79 × (1 − 0,35²) × 100 × 0,3 / 0,001 = 0,79 × 0,8775 × 30 000 ≈ 20 800 kPa. (Chú ý: máy tính dùng Δp và Δs của đoạn thẳng.)</p><p>Thử với <a href=\"#tool/calc/plate\">máy tính nén tấm</a>.</p>"},
  notes:["Mọi hệ số (ω, ν) cần lấy theo tiêu chuẩn thí nghiệm của dự án."],
  quiz:[["Vì sao kết quả nén tấm trên mặt không dùng thẳng cho lớp bùn nằm sâu 8 m?","Tấm nhỏ chỉ ảnh hưởng đến độ sâu khoảng 1–2 lần đường kính, nên không phản ánh được lớp bùn sâu bên dưới."]]
 },
 {
  id:"m8t8", title:"Chất lượng mẫu và đối chiếu thí nghiệm trong phòng với hiện trường",
  summary:"Mẫu bị xáo trộn sẽ cho C<sub>c</sub> thấp, σ′<sub>p</sub> thấp và c<sub>u</sub> thấp hơn thực tế. Biết đánh giá chất lượng mẫu và đối chiếu chéo là kỹ năng quan trọng nhất khi đọc báo cáo.",
  concepts:[

   ["Chỉ số chất lượng mẫu Δe/e<sub>0</sub>","Độ giảm hệ số rỗng khi nén mẫu về ứng suất hữu hiệu tại chỗ σ′<sub>v0</sub> chia cho e<sub>0</sub>. Càng nhỏ mẫu càng tốt."],
   ["Tương quan s_u/σ′_v","Với sét cố kết thường, tỷ số c<sub>u</sub>/σ′<sub>v0</sub> khá ổn định (khoảng 0,2–0,3) nên dùng để kiểm tra c<sub>u</sub>."],
   ["Đối chiếu chéo","So c<sub>u</sub> (ba trục) với cắt cánh và CPTu; C<sub>c</sub> với tương quan theo W<sub>L</sub>; E<sub>oed</sub> với E từ nén tấm."]
  ],
  table:{head:["Δe/e<sub>0</sub>","Chất lượng (theo Lunne và cộng sự, 2006)"],rows:[["< 0,04","Rất tốt đến tốt"],["0,04 đến 0,07","Tốt đến trung bình"],["0,07 đến 0,14","Kém"],["> 0,14","Rất kém"]]},
  formulas:[{name:"Chỉ số chất lượng mẫu",f:"Δe / e<sub>0</sub> = {{e<sub>0</sub> − e<sub>v0</sub>|e<sub>0</sub>}}",symbols:[["e<sub>0</sub>","Hệ số rỗng ban đầu của mẫu."],["e<sub>v0</sub>","Hệ số rỗng khi nén về σ′<sub>v0</sub> tại chỗ."],["Δe","Độ giảm hệ số rỗng."]],cond:"Các ngưỡng trong bảng áp dụng cho sét có OCR thấp đến trung bình; cần đối chiếu nguồn gốc ngưỡng khi dùng trong hồ sơ."}],
  steps:["Lập bảng các chỉ tiêu theo độ sâu và gạch bỏ số liệu có Δe/e<sub>0</sub> rất kém.","Với c<sub>u</sub>, vẽ biểu đồ theo độ sâu từ ba nguồn: ba trục, cắt cánh, CPTu. Tìm xu hướng chung.","Với C<sub>c</sub>, so với 0,009(W<sub>L</sub> − 10). Chênh nhiều lần thì cần giải thích.","Khi số liệu mâu thuẫn, chọn giá trị thận trọng và ghi rõ lý do."],
  notes:["Tương quan c<sub>u</sub>/σ′<sub>v0</sub> và các ngưỡng chất lượng mẫu là kinh nghiệm quốc tế, cần đối chiếu thêm với kinh nghiệm địa phương."],
  quiz:[["Một mẫu có Δe/e_0 = 0,16. Nên làm gì với số liệu của mẫu đó?","Mẫu thuộc nhóm rất kém, số liệu C_c, σ′_p và c_u của nó không đáng tin; nên loại hoặc dùng rất thận trọng và ưu tiên thí nghiệm hiện trường."]]

function labHtml(id){
  const L=LABS[id]; if(!L) return "";
  return sec(L.title.replace(/_(\w+)/g,"<sub>$1</sub>"),`<div class="lab" data-lab="${id}">${L.sl.map(s=>`<label class="sl"><span>${subs(s.lab)}: <b class="sv">${s.def}</b> ${s.u}</span><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.def}" data-k="${s.k}"></label>`).join("")}<div class="lout"></div></div>`);
}
function wireLabs(){
  document.querySelectorAll(".lab").forEach(el=>{
    const L=LABS[el.dataset.lab];
    const upd=()=>{ const v={}; el.querySelectorAll("input").forEach(i=>{ v[i.dataset.k]=+i.value; i.parentNode.querySelector(".sv").textContent=fmt(+i.value,2); });
      const r=L.draw(v); el.querySelector(".lout").innerHTML=`<p>${r.txt}</p><figure class="fig">${r.chart}</figure>`; };
    el.addEventListener("input",upd); upd();
  });
}

let quizState={mod:"all",idx:0,score:0,ans:null,order:[]};
function renderQuiz(){
  currentId=null;
  const pool=QUIZ.map((q,i)=>i).filter(i=>quizState.mod==="all"||QUIZ[i][0]===quizState.mod);
  if(quizState.idx===0&&!quizState.order.length){ quizState.order=pool.slice().sort(()=>Math.random()-0.5); }
  const o=quizState.order;
  let h=`<div class="titleblock" style="--mc:${toolMc}"><h2>Trắc nghiệm</h2><p class="lead">${QUIZ.length} câu hỏi có giải thích. Chọn module rồi bắt đầu.</p></div><div class="row" style="margin:0 0 10px"><select id="qmod"><option value="all">Tất cả module</option>${MODULES.map((m,i)=>`<option value="m${i+1}"${quizState.mod==="m"+(i+1)?" selected":""}>Module ${i+1}</option>`).join("")}</select><button class="btn ghost small" id="qreset">Làm lại</button></div><div id="qbox"></div>`;
  $("#main").innerHTML=h;
  $("#qmod").onchange=e=>{ quizState={mod:e.target.value,idx:0,score:0,ans:null,order:[]}; renderQuiz(); };
  $("#qreset").onclick=()=>{ quizState={mod:quizState.mod,idx:0,score:0,ans:null,order:[]}; renderQuiz(); };
  function draw(){
    const box=$("#qbox");
    if(quizState.idx>=o.length){ box.innerHTML=sec("Kết quả",`<p style="font-size:20px"><b>${quizState.score}/${o.length}</b> câu đúng.</p>`,toolMc); return; }
    const q=QUIZ[o[quizState.idx]], a=quizState.ans;
    box.innerHTML=sec(`Câu ${quizState.idx+1}/${o.length}`,`<p><b>${subs(q[1])}</b></p>${q[2].map((x,i)=>`<button class="opt${a!==null?(i===q[3]?" ok":(i===a?" bad":"")):""}" data-i="${i}">${subs(x)}</button>`).join("")}${a!==null?`<div class="callout note"><span class="lb">${a===q[3]?"Đúng":"Chưa đúng"}</span>${subs(q[4])}</div><button class="btn" id="qnext">Câu tiếp →</button>`:""}`,toolMc);
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ if(quizState.ans!==null) return; quizState.ans=+b.dataset.i; if(quizState.ans===q[3]) quizState.score++; draw(); });
    const nx=$("#qnext"); if(nx) nx.onclick=()=>{ quizState.idx++; quizState.ans=null; draw(); };
  }
  draw(); renderTree(); window.scrollTo(0,0);
}

let cardState={i:0,flip:false,order:[]};
function renderCards(){
  currentId=null;
  if(!cardState.order.length) cardState.order=GLOSS.map((g,i)=>i).sort(()=>Math.random()-0.5);
  const g=GLOSS[cardState.order[cardState.i%GLOSS.length]];
  $("#main").innerHTML=`<div class="titleblock" style="--mc:${toolMc}"><h2>Thẻ ghi nhớ</h2><p class="lead">Nhìn ký hiệu, tự trả lời nghĩa của nó rồi bấm thẻ để lật. Thẻ ${cardState.i%GLOSS.length+1}/${GLOSS.length}.</p></div><div class="card3" id="c3">${cardState.flip?`<b>${g[1]}</b>${g[2]?` <span class="small-muted">(${g[2]})</span>`:""}<p>${g[3]}</p>`:`<div class="gsym big">${g[0]}</div><span class="small-muted">Bấm để lật</span>`}</div><div class="row"><button class="btn ghost" id="cprev">← Thẻ trước</button><button class="btn" id="cnext">Thẻ sau →</button></div>`;
  $("#c3").onclick=()=>{ cardState.flip=!cardState.flip; renderCards(); };
  $("#cnext").onclick=()=>{ cardState.i++; cardState.flip=false; renderCards(); };
  $("#cprev").onclick=()=>{ cardState.i=(cardState.i+GLOSS.length-1)%GLOSS.length; cardState.flip=false; renderCards(); };
  renderTree();
}

function renderCase(){
  currentId=null;
  const a=12,hf=3,m=1.5,gf=18, B=a+2*m*hf, q=gf*hf, H=8, g=15, cc=0.75, e0=0.5*2.65*0+ (0.8*2.65), Cs=0.1*cc, ch=2, cv=1, s=1.2;
  const layers=[0,1,2,3].map(i=>{ const hh=H/4, z=hh*(i+0.5), sv0=(g-GW)*z, ds=q*B/(B+z), r=settleLayer(hh,e0,cc,Cs,sv0,sv0,ds); return {i,hh,z,sv0,ds,S:r.S}; });
  const S=layers.reduce((x,l)=>x+l.S,0), gd=drainGeom(100,4,s,"tri"), F=Fn(gd.n), t=0.5, Uh=UhOf(ch,t,gd.de,F), Uv=UofTv(cv*t/(H*H)), U=1-(1-Uh)*(1-Uv);
  const t90=-ln(1-(1-0.9)/(1-Uv))*gd.de*gd.de*F/(8*ch);
  let h=`<div class="titleblock" style="--mc:${toolMc}"><h2>Ví dụ dự án trọn vẹn (giả định)</h2><p class="lead">Một nền đường đắp trên lớp sét yếu. Mọi số liệu dưới đây là <b>giả định để luyện tập</b>, không phải số liệu dự án thật.</p></div>`;
  h+=sec("Đề bài",`<ul class="plain"><li>Nền đắp: bề rộng đỉnh ${a} m, cao ${hf} m, mái dốc 1:${fmt(m,1)}, dung trọng đắp ${gf} kN/m³.</li><li>Lớp sét yếu dày ${H} m, γ = ${g} kN/m³, W = 80%, G<sub>s</sub> = 2,65 nên e<sub>0</sub> ≈ ${fmt(e0,2)} (giả sử bão hòa: e<sub>0</sub> = W·G<sub>s</sub>), C<sub>c</sub> = ${cc}, C<sub>s</sub> = ${fmt(Cs,3)}, C<sub>v</sub> = ${cv} m²/năm, c<sub>h</sub> = ${ch} m²/năm. Nước ngầm ở mặt, thoát nước một mặt (phía trên).</li><li>Bấc thấm 100×4 mm, lưới tam giác s = ${s} m, chờ ${fmt(t,1)} năm.</li></ul>`,toolMc);
  h+=sec("Bước 1. Tải và bề rộng đáy",`<p>Tải do nền đắp: q = γ<sub>đắp</sub>·h = ${gf}×${hf} = <b>${q} kPa</b>.</p><p>Bề rộng đáy B = a + 2·m·h = ${a} + 2×${m}×${hf} = <b>${B} m</b>.</p>`,toolMc);
  h+=sec("Bước 2. Chia lớp và tính lún từng lớp",`<p>Chia lớp sét làm 4 lớp dày ${H/4} m. Với mỗi lớp lấy giữa lớp: σ′<sub>v0</sub> = (γ − γ<sub>w</sub>)·z; Δσ ≈ q·B/(B + z) (cách gần đúng); đất giả sử cố kết thường.</p><div class="tblwrap"><table><tr><th>Lớp</th><th>z (m)</th><th>σ′<sub>v0</sub> (kPa)</th><th>Δσ (kPa)</th><th>S (cm)</th></tr>${layers.map(l=>`<tr><td class="k">${l.i+1}</td><td>${fmt(l.z,2)}</td><td>${fmt(l.sv0,1)}</td><td>${fmt(l.ds,1)}</td><td>${fmt(l.S*100,1)}</td></tr>`).join("")}<tr><td class="k">Tổng</td><td></td><td></td><td></td><td><b>${fmt(S*100,1)}</b></td></tr></table></div><p>Công thức mỗi lớp: S = C<sub>c</sub>/(1 + e<sub>0</sub>) · h · lg[(σ′<sub>v0</sub> + Δσ)/σ′<sub>v0</sub>]. Tổng lún cuối cùng ≈ <b>${fmt(S*100,0)} cm</b>.</p>`,toolMc);
  h+=sec("Bước 3. Thời gian lún không có bấc thấm",`<p>H<sub>dr</sub> = ${H} m; T<sub>v90</sub> = 0,848; t = 0,848×${H}²/${cv} = <b>${fmt(0.848*H*H/cv,0)} năm</b>. Quá lâu, nên cần bấc thấm.</p>`,toolMc);
  h+=sec("Bước 4. Hiệu quả của bấc thấm",`<p>d<sub>w</sub> = 2(100+4)/π = ${fmt(gd.dw*1000,1)} mm; d<sub>e</sub> = 1,05×${s} = ${fmt(gd.de,3)} m; n = ${fmt(gd.n,1)}; F(n) = ln n − 0,75 = ${fmt(F,2)}.</p><p>Sau ${fmt(t,1)} năm: U<sub>h</sub> = 1 − exp(−8·c<sub>h</sub>·t/(d<sub>e</sub>²·F)) = <b>${pct(Uh)}</b>; U<sub>v</sub> = ${pct(Uv)}; U = 1 − (1−U<sub>h</sub>)(1−U<sub>v</sub>) = <b>${pct(U)}</b>.</p><p>Thời gian đạt U = 90%: khoảng <b>${TIME_TXT(t90)}</b>. Lún còn lại sau ${fmt(t,1)} năm ≈ ${fmt(S*100*(1-U),0)} cm.</p>`,toolMc);
  h+=sec("Bước 5. Kiểm tra sơ bộ ổn định",`<p>Dùng c<sub>u</sub> = 15 kPa, ước thô F<sub>s</sub> ≈ 5,14·c<sub>u</sub>/(γ·h) = 5,14×15/(${gf}×${hf}) = <b>${fmt(5.14*15/q,2)}</b>. Giá trị này chỉ là kiểm tra thô; phải chạy Geoslope theo cung trượt thật. ${5.14*15/q<1.3?"Hệ số thấp hơn 1,3 nên cần đắp theo giai đoạn hoặc gia cường.":""}</p>`,toolMc);
  h+=sec("Nhận xét",`<ul class="plain"><li>Lún lớn (${fmt(S*100,0)} cm) nên phải xử lý và đắp bù lún.</li><li>Bấc thấm biến thời gian từ ${fmt(0.848*H*H/cv,0)} năm xuống còn ${TIME_TXT(t90)}.</li><li>Khi làm dự án thật, thay toàn bộ bằng số liệu khảo sát và tiêu chuẩn áp dụng.</li></ul>`,toolMc);
  $("#main").innerHTML=fx(h); renderTree(); window.scrollTo(0,0);
}

let state = {done:{}, notes:{}, open:{}, calc:{}};
const KEY = "nenYeuApp_v1";
try{ const s = localStorage.getItem(KEY); if(s) state = Object.assign(state, JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const ALL = [];
MODULES.forEach((m,mi)=>m.topics.forEach((t,ti)=>{
  const x = EXTRA[t.id]; if(x){ t.deep = x.deep; t.mist = x.mist; }
  ALL.push({m,mi,t,ti});
}));
const mcOf = mi => `style="--mc:var(--m${mi+1})"`;
const modName = m => m.title.replace(/^Module \d+ - /,"");
let currentId = null;
const TOOLS = [["tool/calc","Máy tính nhanh"],["tool/case","Ví dụ dự án trọn vẹn"],["tool/quiz","Trắc nghiệm"],["tool/cards","Thẻ ghi nhớ"],["tool/gloss","Từ điển ký hiệu"],["tool/ref","Bảng tra nhanh"]];

function renderTree(){
  const q = plain($("#q").value||"").trim();
  const cur = location.hash.slice(1);
  $("#tools").innerHTML = `<div class="tl">Công cụ</div>`+TOOLS.map(t=>`<a href="#${t[0]}"${cur.indexOf(t[0])===0?' class="active"':''}>${t[1]}</a>`).join("");
  const host = $("#tree"); host.innerHTML="";
  MODULES.forEach((m,mi)=>{
    const topics = m.topics.filter(t=> !q || plain(JSON.stringify(t)).includes(q) || plain(m.title).includes(q));
    if(!topics.length) return;
    const doneN = m.topics.filter(t=>state.done[t.id]).length;
    const div = document.createElement("div");
    div.className = "mod" + ((state.open[m.id]||q)?" open":"");
    div.setAttribute("style",`--mc:var(--m${mi+1})`);
    const btn = document.createElement("button"); btn.className="mh";
    btn.innerHTML = `<span class="no">${mi+1}</span><span class="tt">${modName(m)}</span><span class="count">${doneN}/${m.topics.length}</span>`;
    btn.onclick = ()=>{ state.open[m.id] = !div.classList.contains("open"); save(); renderTree(); };
    div.appendChild(btn);
    const ul = document.createElement("ul");
    topics.forEach(t=>{
      const li = document.createElement("li"), a = document.createElement("a");
      a.className = (state.done[t.id]?"done ":"") + (currentId===t.id?"active":"");
      a.innerHTML = `<span class="dot"></span><span>${t.title}</span>`;
      a.onclick = ()=>{ go(t.id); closeMenu(); };
      li.appendChild(a); ul.appendChild(li);
    });
    div.appendChild(ul); host.appendChild(div);
  });
  const total = ALL.length, d = ALL.filter(x=>state.done[x.t.id]).length;
  $("#progTxt").textContent = `Tiến độ: ${d}/${total} bài đã học (${Math.round(d/total*100)}%)`;
  $("#progBar").style.width = (d/total*100)+"%";
}
function tableHtml(tb){
  return `<div class="tblwrap"><table><tr>${tb.head.map(h=>`<th>${h}</th>`).join("")}</tr>${tb.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i==0?' class="k"':''}>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
}
function renderTopic(id){
  const idx = ALL.findIndex(x=>x.t.id===id); if(idx<0) return renderHome();
  const {m,mi,t,ti} = ALL[idx]; currentId = id;

  if(t.formulas) h += sec("Công thức", t.formulas.map(f=>`<div class="formula"><div class="fn">${f.name}</div><div class="fx">${f.f}</div><div class="tr"><b>Trong đó:</b></div><div class="tblwrap"><table>${f.symbols.map(s=>`<tr><td class="k">${sy(s[0])}</td><td>${s[1]}</td></tr>`).join("")}</table></div>${f.cond?`<div class="tr"><b>Điều kiện áp dụng và nhận xét:</b> ${f.cond}</div>`:""}</div>`).join(""));
  if(t.table) h += sec("Bảng tổng hợp", tableHtml(t.table));
  if(t.example) h += sec(t.example.title.replace(/_(\w+)/g,"<sub>$1</sub>"), `<div class="example">${t.example.html}</div>`);
  const rel = CALCS.filter(c=>(c.topics||[]).indexOf(id)>=0);
  if(rel.length) h += sec("Máy tính liên quan", `<div class="toolgrid">${rel.map(c=>`<a class="tcard" href="#tool/calc/${c.id}"><h3>${c.title}</h3><p>${c.desc}</p></a>`).join("")}</div>`);
  h += labHtml(id);

  if(t.quiz) h += sec("Tự kiểm tra", t.quiz.map(q=>`<details><summary>${subs(q[0])}</summary><p>${q[1]}</p></details>`).join(""));
  h += sec("Ghi chú của tôi", `<textarea class="nt" id="note" placeholder="Ghi lại điều bạn hiểu, câu hỏi, số liệu dự án..."></textarea>
    <div class="row"><label><input type="checkbox" id="doneCk"> Đã học xong bài này</label></div>`);
  h += `<div class="nav2"><button class="btn ghost" id="prev" ${idx==0?"disabled":""}>← Bài trước</button><button class="btn" id="next" ${idx==ALL.length-1?"disabled":""}>Bài sau →</button></div></div>`;
  $("#main").innerHTML = fx(h);
  const nt = $("#note"); nt.value = state.notes[id]||"";
  nt.oninput = ()=>{ state.notes[id] = nt.value; save(); };

  ck.onchange = ()=>{ state.done[id] = ck.checked; save(); renderTree(); };
  $("#prev").onclick = ()=>go(ALL[idx-1].t.id);
  $("#next").onclick = ()=>go(ALL[idx+1].t.id);
  wireLabs();
  state.open[m.id]=true; renderTree(); window.scrollTo(0,0);
}
function renderHome(){
  currentId = null;
  const total = ALL.length, d = ALL.filter(x=>state.done[x.t.id]).length;
  const nextT = ALL.find(x=>!state.done[x.t.id]) || ALL[0];
  let h = `<div class="hero"><h2>Xử lý nền đất yếu</h2>
    <p>Sổ tay kỹ thuật theo khung khóa học: tính lún, bấc thấm, cọc xi măng đất, hút chân không, kiểm toán trượt, cùng phần thí nghiệm trong phòng và hiện trường. Có máy tính, từ điển ký hiệu, ví dụ dự án và trắc nghiệm.</p>
    <div class="stats"><div class="stat"><b>${MODULES.length}</b><span>module</span></div><div class="stat"><b>${total}</b><span>bài học</span></div><div class="stat"><b>${CALCS.length}</b><span>máy tính</span></div><div class="stat"><b>${d}</b><span>bài đã học</span></div></div>
    <button class="btn" id="goNext">${d?"Học tiếp: ":"Bắt đầu: "}${plain(nextT.t.title).slice(0,48)}${plain(nextT.t.title).length>48?"...":""}</button></div>`;
  h += `<section class="sec" style="--mc:var(--accent)"><h3>Công cụ</h3><div class="toolgrid">${TOOLS.map(t=>`<a class="tcard" href="#${t[0]}"><h3>${t[1]}</h3></a>`).join("")}</div></section>`;
  h += `<p class="disc">Phần giải thích do người soạn bổ sung từ kiến thức chung về địa kỹ thuật, theo khung đề cương của khóa học. Các con số cụ thể, giới hạn và điều khoản tiêu chuẩn cần đối chiếu với bài giảng, bảng tính của khóa học và văn bản tiêu chuẩn gốc.</p><div class="grid">`;
  MODULES.forEach((m,mi)=>{
    const dn = m.topics.filter(t=>state.done[t.id]).length;
    h += `<div class="mcard" ${mcOf(mi)} data-first="${m.topics[0].id}"><span class="big">Module ${mi+1}</span><h3>${modName(m)}</h3><p>${m.intro}</p><div class="meta">${m.topics.length} bài · đã học ${dn}</div><div class="bar"><i style="width:${dn/m.topics.length*100}%"></i></div></div>`;
  });
  h += `</div><section class="sec" style="--mc:var(--m7)"><h3>Ghi chú và sao lưu</h3><p class="small-muted">Ghi chú và tiến độ lưu ngay trên trình duyệt của thiết bị này. Nên tải ghi chú ra file để sao lưu.</p><div class="row"><button class="btn small" id="expBtn">Tải toàn bộ ghi chú (.txt)</button><button class="btn ghost small" id="rstBtn">Xóa tiến độ và ghi chú</button></div></section>`;
  $("#main").innerHTML = h;
  document.querySelectorAll(".mcard").forEach(c=>c.onclick=()=>go(c.dataset.first));
  $("#goNext").onclick = ()=>go(nextT.t.id);
  $("#expBtn").onclick = exportNotes;
  $("#rstBtn").onclick = ()=>{ if(confirm("Xóa toàn bộ tiến độ và ghi chú trên thiết bị này?")){ state={done:{},notes:{},open:{},calc:{}}; save(); renderTree(); renderHome(); } };
  renderTree(); window.scrollTo(0,0);
}
function exportNotes(){
  let out = "GHI CHÚ - XỬ LÝ NỀN ĐẤT YẾU\n\n";
  ALL.forEach(x=>{ const n = state.notes[x.t.id]; if(n&&n.trim()) out += "## "+plain(x.t.title)+"\n"+n.trim()+"\n\n"; });
  const b = new Blob([out],{type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "ghi-chu-nen-dat-yeu.txt"; a.click();
}
function go(id){ location.hash = id; }
function route0(){
  const hs = location.hash.slice(1), p = hs.split("/");
  if(p[0]==="tool"){
    if(p[1]==="calc") return p[2]?renderCalc(p[2]):renderCalcIndex();
    if(p[1]==="gloss") return renderGloss(p[2]?decodeURIComponent(p[2]):"");
    if(p[1]==="ref") return renderRef();
    if(p[1]==="quiz") return renderQuiz();
    if(p[1]==="cards") return renderCards();
    if(p[1]==="case") return renderCase();
  }
  hs ? renderTopic(hs) : renderHome();
}
function tidyTables(){ document.querySelectorAll("td.k").forEach(td=>{ if(td.textContent.trim().length<=13) td.classList.add("nw"); }); }
function route(){ route0(); tidyTables(); }
window.addEventListener("hashchange", route);
function lockBody(on){ document.documentElement.classList.toggle("noscroll",on); document.body.classList.toggle("noscroll",on); }
function closeMenu(){ $("#side").classList.remove("show"); $("#scrim").classList.remove("show"); lockBody(false); }
$("#menuBtn").onclick = ()=>{ $("#side").classList.add("show"); $("#scrim").classList.add("show"); lockBody(true); };
$("#scrim").onclick = closeMenu;
$("#side").addEventListener("click",e=>{ if(e.target.closest("#tools a")) closeMenu(); });
$("#homeBtn").onclick = ()=>{ location.hash=""; renderHome(); closeMenu(); };
$("#q").oninput = renderTree;
let fsz = 0; try{ fsz = +localStorage.getItem("nenYeuFont")||0; }catch(e){}
function applyFont(){ document.documentElement.style.fontSize = (16+fsz*2)+"px"; }
$("#fontBtn").onclick = ()=>{ fsz = (fsz+1)%3; applyFont(); try{ localStorage.setItem("nenYeuFont",fsz); }catch(e){} };
applyFont();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
renderTree(); route();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2744">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Xử lý nền đất yếu - Sổ tay kỹ thuật</title>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface2:#f5f7fa; --ink:#142033; --muted:#5a6779; --line:#d8dfe8;
  --navy:#0d2744; --navy2:#154070; --accent:#0b78a0; --accent-soft:#e1f0f6;
  --amber:#a86400; --amber-soft:#fff4de; --red:#b3392b; --red-soft:#fdeceb; --ok:#1a8a4a;
  --formula:#edf2fa; --soil:#dccdac; --soft:#c7b898; --sand:#efe0ae; --water:#a3cde8; --fillc:#c4cad1; --conc:#aab1b9;
  --shadow:0 1px 2px rgba(15,30,55,.07),0 4px 14px rgba(15,30,55,.05);
  --m1:#0b78a0; --m2:#2c7d50; --m3:#8c6a1c; --m4:#6a4ea3; --m5:#0b8590; --m6:#b0452d; --m7:#4a5a72;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b121b; --surface:#141e2a; --surface2:#1a2634; --ink:#e5ebf3; --muted:#97a5b7; --line:#273548;
    --navy:#0a1d33; --navy2:#123a62; --accent:#4cb3dc; --accent-soft:#14303d;
    --amber:#f0a748; --amber-soft:#33260f; --red:#f08a7c; --red-soft:#351b18; --ok:#4cc882;
    --formula:#16233a; --soil:#5b4e38; --soft:#4a3f2d; --sand:#7a6c40; --water:#2c5a78; --fillc:#4a525c; --conc:#5d656f;
    --shadow:none;
    --m1:#4cb3dc; --m2:#5fcf8b; --m3:#d7b25a; --m4:#a58ae0; --m5:#4fd0d8; --m6:#f0937c; --m7:#9fb0c8;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
/* ---------- thanh trên ---------- */
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header.top .logo{flex:0 0 34px;height:34px}
header.top .brand{flex:1;min-width:0;line-height:1.25}
header.top .brand b{display:block;font-size:16px;letter-spacing:.2px}
header.top .brand span{display:block;font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 12px;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.24)}
#menuBtn{display:none;font-size:18px;padding:5px 11px}
/* ---------- bố cục ---------- */
.layout{display:flex;max-width:1240px;margin:0 auto}
nav#side{width:320px;flex:0 0 320px;padding:14px;position:sticky;top:53px;align-self:flex-start;max-height:calc(100vh - 53px);overflow:auto}
main{flex:1;min-width:0;padding:16px 20px 90px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;margin-bottom:10px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.bar{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.mod{margin-bottom:7px}
.mod>button.mh{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);font-weight:600;font-size:14px;line-height:1.35;display:flex;gap:9px;align-items:center}
.mod>button.mh .no{flex:0 0 26px;height:26px;border-radius:7px;background:var(--mc);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.mod>button.mh .tt{flex:1}
.mod .count{color:var(--muted);font-weight:400;font-size:12.5px;white-space:nowrap}
.mod ul{list-style:none;margin:3px 0 0;padding:0 0 0 8px;display:none;border-left:2px solid var(--mc);margin-left:13px}
.mod.open ul{display:block}
.mod li a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;color:var(--ink);font-size:13.8px;line-height:1.4;cursor:pointer}
.mod li a:hover{background:var(--accent-soft)}
.mod li a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.mod li a .dot{flex:0 0 14px;height:14px;border:2px solid var(--line);border-radius:50%;margin-top:3px}
.mod li a.done .dot{background:var(--ok);border-color:var(--ok)}
/* ---------- trang chủ ---------- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:14px;padding:26px 24px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;border:30px solid rgba(255,255,255,.06)}
.hero h2{margin:0 0 6px;font-size:27px;line-height:1.25}
.hero p{margin:0 0 14px;max-width:640px;opacity:.9}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12.5px;opacity:.85}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.hero .btn{background:#fff;color:var(--navy)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);font-weight:500}
.btn.small{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mc);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mcard:hover{border-color:var(--mc)}
.mcard .big{font-size:12.5px;font-weight:700;color:var(--mc);letter-spacing:.6px;text-transform:uppercase}
.mcard h3{margin:2px 0 6px;font-size:16.5px;line-height:1.35}
.mcard p{margin:0 0 10px;font-size:14.5px;color:var(--muted);flex:1}
.mcard .meta{font-size:13px;color:var(--muted)}
.mcard .bar>i{background:var(--mc)}
/* ---------- trang bài ---------- */
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.crumb b{color:var(--mc)}
.titleblock{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--mc);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.titleblock h2{margin:0 0 8px;font-size:23px;line-height:1.3}
.lead{background:var(--accent-soft);border-radius:8px;padding:9px 12px;margin:0;font-size:16px}
.lead b{color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec>h3{margin:0 0 10px;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:var(--mc);display:flex;align-items:center;gap:8px}
.sec>h3:before{content:"";width:9px;height:9px;border-radius:2px;background:var(--mc)}
.sec h4{margin:12px 0 4px;font-size:16px}
.sec p{margin:6px 0}
.formula{background:var(--formula);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:8px;padding:10px 12px;margin:10px 0}
.formula .fn{font-weight:600;margin-bottom:2px}
.formula .fx{font-family:"Cambria Math","STIX Two Math",Cambria,Georgia,serif;font-size:19px;padding:5px 0 7px;overflow-x:auto;color:var(--ink)}
.formula .tr{font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:14px}
td.k{font-weight:600;white-space:normal;width:1%;min-width:6.5em;max-width:12.5em;overflow-wrap:anywhere}
td.k.nw{white-space:nowrap;min-width:0;max-width:none}
td:not(.k){width:auto}
@media (max-width:860px){th,td{padding:6px 7px}table{font-size:14.5px}td.k{max-width:10em}}
.tblwrap{overflow-x:auto}
.callout{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:15.5px;border-left:4px solid}
.callout.note{background:var(--amber-soft);border-color:var(--amber)}
.callout.mist{background:var(--red-soft);border-color:var(--red)}
.callout .lb{display:block;font-weight:700;font-size:13px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.callout.note .lb{color:var(--amber)} .callout.mist .lb{color:var(--red)}
.example{border:1.5px dashed var(--mc);border-radius:8px;padding:10px 13px;margin:8px 0;background:var(--surface2)}
.example .eh{font-weight:700;margin-bottom:3px}
ol.steps{margin:6px 0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:3px 0 3px 38px;margin:5px 0}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:3px;width:26px;height:26px;border-radius:50%;background:var(--mc);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ul.plain{margin:6px 0;padding-left:22px}
li{margin:3px 0}
details{border:1px solid var(--line);border-radius:8px;padding:7px 12px;margin:7px 0;background:var(--surface2)}
details summary{cursor:pointer;font-weight:600}
textarea.nt{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
figure.fig{margin:0 0 10px;padding:6px 6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
figure.fig figcaption{font-size:13.5px;color:var(--muted);padding:2px 8px 8px;line-height:1.5}
.small-muted{color:var(--muted);font-size:14px}
.disc{font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding:2px 10px;margin:0 0 16px}
/* ---------- sơ đồ SVG ---------- */
svg.dg{width:100%;height:auto;display:block}
.dg text{fill:var(--ink);font:12.5px -apple-system,"Segoe UI",Arial,sans-serif}
.dg .t2{fill:var(--muted);font-size:11.5px}
.dg .tb{font-weight:700}
.dg .tw{fill:#fff}
.dg .ln{stroke:var(--ink);fill:none;stroke-width:1.5}
.dg .thin{stroke-width:1}
.dg .dash{stroke-dasharray:5 4}
.dg .ac{stroke:var(--accent);fill:none;stroke-width:2.4}
.dg .am{stroke:var(--amber);fill:none;stroke-width:2.4}
.dg .rd{stroke:var(--red);fill:none;stroke-width:2.2}
.dg .soil{fill:var(--soil);stroke:var(--ink);stroke-width:1}
.dg .soft{fill:var(--soft);stroke:var(--ink);stroke-width:1}
.dg .sand{fill:var(--sand);stroke:var(--ink);stroke-width:1}
.dg .water{fill:var(--water);stroke:none}
.dg .fillc{fill:var(--fillc);stroke:var(--ink);stroke-width:1.2}
.dg .conc{fill:var(--conc);stroke:var(--ink);stroke-width:1.2}
.dg .camb{fill:var(--amber);fill-opacity:.55;stroke:var(--amber);stroke-width:1.2}
.dg .cacc{fill:var(--accent);fill-opacity:.4;stroke:var(--accent);stroke-width:1.2}
.mk{fill:var(--ink)} .mka{fill:var(--accent)} .mkm{fill:var(--amber)} .mkr{fill:var(--red)}
.dg .hls{paint-order:stroke;stroke:var(--soft);stroke-width:3px;stroke-linejoin:round}
.dg .hl{paint-order:stroke;stroke:var(--fillc);stroke-width:3px;stroke-linejoin:round}
@media (max-width:860px){
  figure.fig{overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg.dg{min-width:600px}
  #menuBtn{display:block}
  nav#side{position:fixed;left:0;top:0;bottom:0;z-index:30;width:88%;max-width:350px;max-height:none;background:var(--bg);transform:translateX(-102%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top));box-shadow:2px 0 16px rgba(0,0,0,.35)}
  nav#side.show{transform:none}
  #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  #scrim.show{display:block}
  main{padding:12px 11px 90px}
  .sec{padding:13px 13px 14px}
  .titleblock{padding:14px}
  .titleblock h2{font-size:20px}
  .hero{padding:20px 16px}
  .hero h2{font-size:22px}
  header.top .brand span{display:none}
}
@media print{
  header.top,nav#side,.nav2,.row,#scrim{display:none!important}
  body{background:#fff}.sec,.titleblock{box-shadow:none;break-inside:avoid}
}
:root{--m8:#9a4f7a;--m9:#5d7a2c}
@media (prefers-color-scheme: dark){:root{--m8:#e08ec0;--m9:#a8cf6a}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.gl{color:inherit;text-decoration:underline dotted var(--accent);text-underline-offset:3px}
.gitem{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.gitem.hit{background:var(--accent-soft);border-radius:8px;padding:9px}
.gsym{flex:0 0 74px;font:600 19px "Cambria Math",Cambria,Georgia,serif;color:var(--accent)}
.gsym.big{font-size:42px;text-align:center;margin:26px 0 8px}
.gbody p{margin:3px 0}
#tools{margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
#tools .tl{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#tools a{padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px;background:var(--surface);border:1px solid var(--line)}
#tools a:hover,#tools a.active{border-color:var(--accent);color:var(--accent)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tcard{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.tcard h3{margin:0 0 3px;font-size:15px}.tcard p{margin:0;font-size:13.5px;color:var(--muted)}
.tcard:hover{border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}.fld.wide{grid-column:1/-1}
.fl{font-size:14px;font-weight:600}.fl i{font-weight:400;color:var(--muted)}
.fh{font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea,#qmod{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;width:100%}
.fld textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.reslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0}
.res{background:var(--accent-soft);border-radius:9px;padding:8px 11px;display:flex;flex-direction:column}
.res b{font-size:20px;color:var(--accent)}.res span{font-size:13px;color:var(--muted)}
.sl{display:block;margin:8px 0}.sl input{width:100%}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}
.opt.ok{background:var(--accent-soft);border-color:var(--ok)}.opt.bad{background:var(--red-soft);border-color:var(--red)}
.card3{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:200px;text-align:center;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow)}
.dg .gridl{stroke:var(--line);stroke-width:1}
.dg .hlw{paint-order:stroke;stroke:var(--surface2);stroke-width:3px;stroke-linejoin:round}
nav#side,.tblwrap,figure.fig,textarea{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
html.noscroll,body.noscroll{overflow:hidden;overscroll-behavior:none}
@media (max-width:860px){nav#side{height:100vh;height:100dvh;bottom:auto;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:120px}#scrim{touch-action:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10z" fill="currentColor"/></marker>
  <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mka" d="M0,0 L10,5 L0,10z"/></marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkm" d="M0,0 L10,5 L0,10z"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkr" d="M0,0 L10,5 L0,10z"/></marker>
</defs></svg>
<header class="top">
  <button id="menuBtn" class="hbtn" aria-label="Mở mục lục">☰</button>
  <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="rgba(255,255,255,.14)"/><path d="M5 12h24" stroke="#fff" stroke-width="2"/><path d="M5 17c4 0 4 5 8 5s4-5 8-5 4 5 8 5" fill="none" stroke="#7fd0ee" stroke-width="2"/><path d="M9 22v7M17 22v7M25 22v7" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
  <div class="brand"><b>Xử lý nền đất yếu</b><span>Sổ tay kỹ thuật theo khóa học</span></div>
  <button class="hbtn" id="fontBtn" aria-label="Cỡ chữ">Aa</button>
  <button class="hbtn" id="homeBtn">Trang chủ</button>
</header>
<div id="scrim"></div>
<div class="layout">
  <nav id="side">
    <input class="search" id="q" type="search" placeholder="Tìm chủ đề, thuật ngữ...">
    <div class="prog"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
    <div id="tools"></div>
    <div id="tree"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
/* ============ DỮ LIỆU NỘI DUNG ============ */
const MODULES = [
{
 id:"m1", title:"Module 1 - Tính lún và dự báo lún",
 intro:"Đất yếu là nền đất dễ lún nhiều, lún lâu và chịu tải kém. Trước khi xử lý, kỹ sư phải biết: (1) đất có yếu thật không, (2) sẽ lún bao nhiêu, (3) lún nhanh hay chậm. Module này trả lời 3 câu hỏi đó.",
 topics:[
 {
  id:"m1t1", title:"Cách đọc bảng tổng hợp số liệu địa chất",
  summary:"Bảng tổng hợp địa chất liệt kê từng lớp đất kèm các chỉ tiêu cơ lý. Đọc đúng bảng là bước đầu tiên của mọi tính toán nền móng.",
  concepts:[
   ["γ (gamma)","Dung trọng tự nhiên của đất, đơn vị kN/m³. Là trọng lượng 1 m³ đất ở trạng thái tự nhiên. Dùng để tính ứng suất do bản thân đất."],
   ["W","Độ ẩm tự nhiên (%) = khối lượng nước / khối lượng hạt đất khô × 100."],
   ["W<sub>L</sub>","Giới hạn chảy (%). Độ ẩm mà tại đó đất chuyển từ trạng thái dẻo sang chảy."],
   ["W<sub>P</sub>","Giới hạn dẻo (%). Độ ẩm mà tại đó đất chuyển từ trạng thái cứng sang dẻo."],
   ["I<sub>P</sub>","Chỉ số dẻo = W<sub>L</sub> − W<sub>P</sub>. Càng lớn, đất càng sét, càng nhiều hạt mịn."],
   ["I<sub>L</sub>","Độ sệt (xem bài sau). Cho biết đất đang cứng hay mềm."],
   ["e<sub>0</sub>","Hệ số rỗng ban đầu = thể tích lỗ rỗng / thể tích hạt đất. Đất yếu thường có e<sub>0</sub> lớn (từ khoảng 1,0 trở lên)."],
   ["c, φ","Lực dính đơn vị c (kPa) và góc ma sát trong φ (độ). Là hai thông số sức chống cắt của đất, dùng cho tính ổn định và sức chịu tải."],
   ["a<sub>1-2</sub>","Hệ số nén lún (1/kPa hoặc cm²/kg), đo trong khoảng áp lực 100–200 kPa. Càng lớn, đất càng dễ lún."],
   ["E<sub>0</sub>","Mô đun biến dạng của đất (kPa hoặc MPa). Càng nhỏ, đất càng yếu."],
   ["C<sub>c</sub>, C<sub>s</sub>","Chỉ số nén (C<sub>c</sub>) và chỉ số nở (C<sub>s</sub>) từ thí nghiệm nén cố kết. Dùng để tính lún cố kết."],
   ["C<sub>v</sub>","Hệ số cố kết (cm²/s hoặc m²/năm). Cho biết nước thoát ra nhanh hay chậm, quyết định thời gian lún."],
   ["N (SPT)","Số búa xuyên tiêu chuẩn: số nhát búa để mũi xuyên đi sâu 30 cm. N càng nhỏ, đất càng yếu."]
  ],
  steps:[
   "Xác định tên và độ dày từng lớp đất (cột “Lớp”, “Chiều dày”).",
   "Xem trạng thái: độ sệt I<sub>L</sub> (đất dính) hoặc N-SPT (đất rời và đất dính).",
   "Xem nhóm chỉ tiêu vật lý: γ, W, W<sub>L</sub>, W<sub>P</sub>, e<sub>0</sub> để nhận biết đất yếu.",
   "Xem nhóm chỉ tiêu cơ học: c, φ (cho trượt và sức chịu tải), a<sub>1-2</sub>, E<sub>0</sub>, C<sub>c</sub> (cho lún), C<sub>v</sub> (cho thời gian lún).",
   "Kiểm tra số mẫu thí nghiệm, giá trị trung bình và giá trị tiêu chuẩn. Giá trị nào chênh lệch bất thường thì cần xem lại độ tin cậy.",
   "Đối chiếu với mặt cắt địa chất dọc tuyến để biết lớp yếu dày nhất nằm ở đâu."
  ],
  notes:["Một số chỉ tiêu có hai giá trị: giá trị tiêu chuẩn và giá trị tính toán. Cần biết bảng đang ghi giá trị nào trước khi đưa vào bảng tính."],
  quiz:[["Chỉ tiêu nào cho biết đất lún nhanh hay chậm?","Hệ số cố kết C<sub>v</sub>. C<sub>v</sub> càng lớn, nước thoát càng nhanh, đất lún xong càng sớm."]]
 },
 {
  id:"m1t2", title:"Nhận biết đất yếu qua độ sệt I<sub>L</sub> và SPT",
  summary:"Có hai “thước đo” nhanh để nhận ra đất yếu: độ sệt I<sub>L</sub> (từ thí nghiệm phòng) và số búa SPT (từ hiện trường).",
  formulas:[{
   name:"Độ sệt của đất dính",
   f:"I<sub>L</sub> = (W − W<sub>P</sub>) / (W<sub>L</sub> − W<sub>P</sub>) = (W − W<sub>P</sub>) / I<sub>P</sub>",
   symbols:[["I<sub>L</sub>","Độ sệt, không có đơn vị."],["W","Độ ẩm tự nhiên (%)."],["W<sub>P</sub>","Giới hạn dẻo (%)."],["W<sub>L</sub>","Giới hạn chảy (%)."],["I<sub>P</sub>","Chỉ số dẻo (%)."]],
   cond:"Đất dính được xếp vào nhóm “yếu” khi I<sub>L</sub> lớn (thường từ khoảng 0,75 trở lên), tức là độ ẩm tự nhiên đã sát hoặc vượt giới hạn chảy."
  }],
  table:{head:["Giá trị I<sub>L</sub>","Trạng thái đất dính (tham khảo)"],rows:[
   ["I<sub>L</sub> ≤ 0","Cứng"],["0 < I<sub>L</sub> ≤ 0,25","Nửa cứng"],["0,25 < I<sub>L</sub> ≤ 0,5","Dẻo cứng"],["0,5 < I<sub>L</sub> ≤ 0,75","Dẻo mềm"],["0,75 < I<sub>L</sub> ≤ 1","Dẻo chảy (yếu)"],["I<sub>L</sub> > 1","Chảy (rất yếu)"]]},
  concepts:[
   ["SPT","Standard Penetration Test: đóng ống mẫu bằng búa tạ 63,5 kg rơi tự do cao 76 cm, đếm số nhát búa cho 30 cm cuối. Kết quả là N."],
   ["Đất yếu theo SPT (tham khảo)","Với đất sét, N khoảng từ 0 đến 4 thường được xem là rất mềm đến mềm. Với bùn, than bùn, giá trị N thường rất thấp (gần 0–2)."],
   ["Bùn và than bùn","Đất có hàm lượng hữu cơ cao, độ ẩm rất lớn, e<sub>0</sub> thường lớn hơn 1,5. Là loại đất yếu nhất, lún lớn và kéo dài."]
  ],
  example:{title:"Ví dụ tính độ sệt",html:"Một lớp sét có W = 48%, W<sub>L</sub> = 50%, W<sub>P</sub> = 26%.<br>Bước 1: I<sub>P</sub> = 50 − 26 = 24%.<br>Bước 2: I<sub>L</sub> = (48 − 26) / 24 = 22 / 24 ≈ 0,92.<br>Bước 3: so với bảng, 0,75 &lt; 0,92 ≤ 1 nên là sét <b>dẻo chảy</b>, thuộc nhóm đất yếu."},
  notes:["Các ngưỡng trong bảng là cách phân loại thường gặp. Khi làm hồ sơ chính thức, hãy dùng bảng phân loại trong tiêu chuẩn mà dự án áp dụng."],
  quiz:[["Một lớp sét có I<sub>L</sub> = 1,2 thì ở trạng thái nào?","I<sub>L</sub> lớn hơn 1 nghĩa là độ ẩm tự nhiên vượt giới hạn chảy, đất ở trạng thái chảy, rất yếu."]]
 },
 {
  id:"m1t3", title:"Tính lún theo tiêu chuẩn cơ sở 41-2022 và thí nghiệm nén cố kết",
  summary:"Khi đắp nền lên đất yếu, ứng suất tăng làm nước trong lỗ rỗng thoát dần, đất bị nén lại: gọi là lún cố kết. Thí nghiệm nén cố kết (oedometer) cho biết đất sẽ nén bao nhiêu.",
  concepts:[
   ["Thí nghiệm nén cố kết","Đặt mẫu đất trong vòng thép, nén theo từng cấp tải (ví dụ 12,5; 25; 50; 100; 200; 400; 800 kPa), giữ mỗi cấp 24 giờ và đo độ lún. Từ đó vẽ đường cong e–log σ′ (hệ số rỗng theo logarit áp lực)."],
   ["σ′<sub>v0</sub>","Ứng suất hữu hiệu thẳng đứng do bản thân đất tại giữa lớp tính lún (kPa). Bằng ứng suất tổng trừ áp lực nước lỗ rỗng."],
   ["σ′<sub>p</sub>","Áp lực tiền cố kết: áp lực lớn nhất đất từng chịu trong quá khứ."],
   ["OCR","Tỷ số quá cố kết = σ′<sub>p</sub> / σ′<sub>v0</sub>. OCR ≈ 1 là đất cố kết thường (NC), OCR &gt; 1 là quá cố kết (OC)."],
   ["Δσ","Gia tăng ứng suất thẳng đứng do tải trọng nền đắp tại giữa lớp (kPa). Giảm dần theo độ sâu và theo khoảng cách từ tim nền."]
  ],
  formulas:[{
   name:"Lún cố kết cuối cùng của một lớp đất cố kết thường (phương pháp phân tố)",
   f:"S = [ C<sub>c</sub> / (1 + e<sub>0</sub>) ] × H × lg [ (σ′<sub>v0</sub> + Δσ) / σ′<sub>v0</sub> ]",
   symbols:[["S","Độ lún cố kết cuối cùng của lớp (m)."],["C<sub>c</sub>","Chỉ số nén, là độ dốc đoạn thẳng của đường e–lg σ′."],["e<sub>0</sub>","Hệ số rỗng ban đầu của lớp."],["H","Chiều dày lớp tính lún (m). Lớp dày nên chia thành nhiều phân lớp nhỏ (khoảng 1–2 m) rồi cộng lún."],["σ′<sub>v0</sub>","Ứng suất hữu hiệu ban đầu giữa lớp (kPa)."],["Δσ","Gia tăng ứng suất do tải ngoài (kPa)."],["lg","Logarit thập phân (cơ số 10)."]],
   cond:"Công thức này dùng khi đất cố kết thường (σ′<sub>v0</sub> ≈ σ′<sub>p</sub>). Nếu đất quá cố kết thì phải tách làm hai đoạn: đoạn đầu dùng C<sub>s</sub> đến σ′<sub>p</sub>, đoạn sau dùng C<sub>c</sub>."
  }],
  example:{title:"Ví dụ tính lún (từng bước)",html:"Lớp bùn sét dày H = 4 m, e<sub>0</sub> = 1,8; C<sub>c</sub> = 0,9; σ′<sub>v0</sub> = 20 kPa; Δσ = 60 kPa.<br>Bước 1: C<sub>c</sub> / (1 + e<sub>0</sub>) = 0,9 / 2,8 ≈ 0,3214.<br>Bước 2: (σ′<sub>v0</sub> + Δσ) / σ′<sub>v0</sub> = 80 / 20 = 4; lg 4 ≈ 0,602.<br>Bước 3: S = 0,3214 × 4 × 0,602 ≈ <b>0,77 m</b>.<br>Nhận xét: lún gần 80 cm, rất lớn, nên cần xử lý nền và dự báo lún kỹ."},
  steps:[
   "Chia nền đất thành các phân lớp mỏng (thường 1–2 m).",
   "Tính σ′<sub>v0</sub> tại giữa mỗi phân lớp (dùng γ, mực nước ngầm).",
   "Tính Δσ tại giữa mỗi phân lớp do tải nền đắp.",
   "Xác định C<sub>c</sub>, C<sub>s</sub>, e<sub>0</sub>, σ′<sub>p</sub> từ thí nghiệm nén cố kết.",
   "Tính lún từng phân lớp rồi cộng lại.",
   "Dừng tính ở độ sâu mà Δσ nhỏ so với σ′<sub>v0</sub> (thường Δσ ≈ 10–20% σ′<sub>v0</sub>)."
  ],
  notes:["Khóa học nêu rõ phương pháp theo Tiêu chuẩn cơ sở 41-2022. Phần giải thích ở đây là nguyên lý chung; các hệ số, cách chia lớp, độ sâu tắt lún và cách tính Δσ cần đối chiếu đúng điều khoản trong tiêu chuẩn đó và bảng tính kèm khóa học."],
  quiz:[["Khi Δσ tăng gấp đôi thì lún có tăng gấp đôi không?","Không. Lún tỷ lệ với logarit của tỷ số (σ′<sub>v0</sub>+Δσ)/σ′<sub>v0</sub>, nên tăng chậm hơn tải."]]
 },
 {
  id:"m1t4", title:"Dự báo độ lún cố kết theo thời gian",
  summary:"Lún cuối cùng S chỉ cho biết tổng lún. Để biết sau bao lâu thì đạt bao nhiêu phần trăm, ta dùng lý thuyết cố kết Terzaghi.",
  concepts:[
   ["U","Độ cố kết trung bình (từ 0 đến 1, hoặc 0–100%). U = 0,9 nghĩa là đã lún được 90% tổng lún."],
   ["T<sub>v</sub>","Nhân tố thời gian thẳng đứng, không có đơn vị."],
   ["H<sub>dr</sub>","Chiều dài đường thoát nước dài nhất (m). Lớp đất thoát nước một mặt thì H<sub>dr</sub> = H. Thoát nước hai mặt (trên và dưới đều có lớp cát) thì H<sub>dr</sub> = H/2."]
  ],
  formulas:[
   {name:"Nhân tố thời gian", f:"T<sub>v</sub> = C<sub>v</sub> × t / H<sub>dr</sub>²",
    symbols:[["T<sub>v</sub>","Nhân tố thời gian."],["C<sub>v</sub>","Hệ số cố kết thẳng đứng (m²/năm)."],["t","Thời gian kể từ lúc đặt tải (năm)."],["H<sub>dr</sub>","Chiều dài đường thoát nước (m)."]],
    cond:"Đơn vị của C<sub>v</sub> và t phải thống nhất (ví dụ cùng là m² và năm)."},
   {name:"Quan hệ giữa U và T<sub>v</sub>", f:"U &lt; 60%: T<sub>v</sub> = (π/4) × U²<br>U ≥ 60%: T<sub>v</sub> = −0,933 × lg(1 − U) − 0,085",
    symbols:[["π","Số pi ≈ 3,1416."],["U","Độ cố kết, viết dạng số thập phân (60% là 0,6)."],["lg","Logarit thập phân."]],
    cond:"Hai biểu thức xấp xỉ đường cong lý thuyết Terzaghi cho bài toán thoát nước một chiều."}
  ],
  example:{title:"Ví dụ: sau bao lâu thì lún đạt 90%?",html:"Lớp sét dày 4 m, thoát nước một mặt nên H<sub>dr</sub> = 4 m; C<sub>v</sub> = 2 m²/năm.<br>Bước 1: U = 0,9 ≥ 0,6 nên dùng công thức thứ hai: T<sub>v</sub> = −0,933 × lg(0,1) − 0,085 = 0,933 − 0,085 = 0,848.<br>Bước 2: t = T<sub>v</sub> × H<sub>dr</sub>² / C<sub>v</sub> = 0,848 × 16 / 2 ≈ <b>6,8 năm</b>.<br>Nhận xét: quá lâu cho công trình, vì vậy phải dùng bấc thấm để rút ngắn đường thoát nước (Module 2)."},
  steps:["Tính tổng lún S (bài trước).","Xác định C<sub>v</sub> và H<sub>dr</sub>.","Với mỗi thời điểm t, tính T<sub>v</sub> rồi suy ra U.","Lún tại thời điểm t là S<sub>t</sub> = U × S.","Vẽ biểu đồ lún theo thời gian để dự báo thời điểm xây dựng mặt đường."],
  notes:["Thời gian cố kết tỷ lệ với bình phương chiều dài đường thoát nước. Giảm H<sub>dr</sub> đi một nửa thì thời gian giảm 4 lần. Đây là lý do của giải pháp bấc thấm."],
  quiz:[["Vì sao thoát nước hai mặt làm đất lún nhanh gấp 4 lần?","H<sub>dr</sub> giảm một nửa, mà t tỷ lệ với H<sub>dr</sub>², nên t giảm còn 1/4."]]
 }
 ]
},
{
 id:"m2", title:"Module 2 - Xử lý nền bằng giếng cát, bấc thấm",
 intro:"Nếu đất lún quá chậm, ta tạo thêm đường thoát nước nằm ngang ngắn bằng cách cắm bấc thấm (PVD) hoặc làm giếng cát (SD), kết hợp đắp gia tải để ép nước ra nhanh.",
 topics:[
 {
  id:"m2t1", title:"Bấc thấm PVD và giếng cát SD",
  summary:"PVD (Prefabricated Vertical Drain) là băng nhựa có lõi dẫn nước bọc vải lọc, cắm thẳng đứng vào nền. SD (Sand Drain) là cột cát đường kính lớn. Cả hai tạo đường thoát nước ngắn theo phương ngang.",
  concepts:[
   ["PVD","Bấc thấm dạng băng, thường rộng khoảng 100 mm, dày 3–5 mm, cắm bằng máy cắm có ống dẫn."],
   ["SD","Giếng cát: khoan hoặc đóng ống, đổ cát thô thấm nước tốt vào lỗ."],
   ["s","Khoảng cách giữa các bấc (m). Bố trí theo lưới tam giác hoặc lưới vuông."],
   ["d<sub>e</sub>","Đường kính vùng ảnh hưởng của một bấc (m): d<sub>e</sub> = 1,05 s (lưới tam giác) hoặc 1,13 s (lưới vuông)."],
   ["d<sub>w</sub>","Đường kính tương đương của bấc (m). Bấc dạng băng rộng a, dày b: d<sub>w</sub> = 2(a + b)/π."],
   ["n","Tỷ số n = d<sub>e</sub> / d<sub>w</sub>."],
   ["c<sub>h</sub>","Hệ số cố kết theo phương ngang (m²/năm), thường lớn hơn C<sub>v</sub> (khoảng 1–3 lần tùy loại đất)."]
  ],
  formulas:[
   {name:"Độ cố kết theo phương ngang (Barron-Hansbo, dạng đơn giản)", f:"U<sub>h</sub> = 1 − exp[ −8 T<sub>h</sub> / F(n) ]",
    symbols:[["U<sub>h</sub>","Độ cố kết do thoát nước ngang."],["exp","Hàm mũ cơ số e (e ≈ 2,718)."],["T<sub>h</sub>","Nhân tố thời gian ngang = c<sub>h</sub> × t / d<sub>e</sub>²."],["F(n)","Hệ số kể đến mật độ bấc, F(n) = ln(n) − 3/4 khi bỏ qua vùng đất bị xáo trộn quanh bấc."]],
    cond:"Khi có kể vùng xáo trộn (smear), F(n) lớn hơn và U<sub>h</sub> nhỏ hơn. Bỏ qua smear cho kết quả lạc quan, nên chỉ dùng để hiểu nguyên lý."},
   {name:"Độ cố kết tổng hợp (ngang + đứng)", f:"U = 1 − (1 − U<sub>h</sub>) × (1 − U<sub>v</sub>)",
    symbols:[["U","Độ cố kết tổng hợp."],["U<sub>h</sub>","Độ cố kết do thoát nước ngang."],["U<sub>v</sub>","Độ cố kết do thoát nước thẳng đứng (bài Module 1)."]],
    cond:"Đặt bấc dày thì U<sub>h</sub> chiếm phần lớn, U<sub>v</sub> thường nhỏ nên có thể bỏ qua cho an toàn."}
  ],
  example:{title:"Ví dụ: bấc 100×4 mm, lưới tam giác s = 1,2 m, sau 6 tháng",html:"Cho c<sub>h</sub> = 2 m²/năm; t = 0,5 năm.<br>Bước 1: d<sub>w</sub> = 2(100 + 4)/π ≈ 66,2 mm = 0,0662 m.<br>Bước 2: d<sub>e</sub> = 1,05 × 1,2 = 1,26 m; n = 1,26 / 0,0662 ≈ 19,0.<br>Bước 3: F(n) = ln 19,0 − 0,75 ≈ 2,946 − 0,75 = 2,196.<br>Bước 4: T<sub>h</sub> = 2 × 0,5 / 1,26² ≈ 0,630.<br>Bước 5: U<sub>h</sub> = 1 − exp(−8 × 0,630 / 2,196) = 1 − exp(−2,295) ≈ 1 − 0,101 = <b>0,90 (90%)</b>.<br>So với 6,8 năm khi không có bấc (ví dụ Module 1), bấc thấm rút thời gian xuống còn khoảng nửa năm."},
  steps:["Xác định tổng lún và độ cố kết yêu cầu (thường 90%) trong thời gian cho phép.","Chọn loại bấc, khoảng cách s và kiểu lưới.","Tính d<sub>e</sub>, d<sub>w</sub>, n, F(n).","Tính U<sub>h</sub> theo thời gian, kiểm tra đạt yêu cầu chưa.","Điều chỉnh s hoặc chiều sâu cắm cho tới khi đạt, rồi tính chi phí."],
  notes:["Bảng tính kèm theo khóa học xử lý đầy đủ các yếu tố như vùng xáo trộn, lực cản của bấc. Phần ví dụ ở đây giúp bạn nắm nguyên lý trước khi dùng bảng tính."],
  quiz:[["Giảm khoảng cách bấc s thì U<sub>h</sub> thay đổi thế nào?","s nhỏ làm d<sub>e</sub> nhỏ, T<sub>h</sub> tăng, F(n) giảm, nên U<sub>h</sub> tăng, nền cố kết nhanh hơn nhưng tốn bấc hơn."]]
 },
 {
  id:"m2t2", title:"Bấc thấm đứng PVD kết hợp bấc thấm ngang SBD",
  summary:"Thông thường, nước từ bấc đứng thoát lên lớp đệm cát dày 0,5–1 m ở mặt nền. Có thể thay lớp đệm cát bằng bấc thấm ngang để giảm chi phí cát.",
  concepts:[
   ["SBD","Bấc thấm đặt nằm ngang trên mặt nền, nối với đầu các bấc đứng, dẫn nước ra mép nền đắp."],
   ["Lớp đệm cát","Lớp cát thoát nước phủ trên mặt nền, nhận nước từ đầu bấc đứng và dẫn ra ngoài. Cát tốn kém và phải vận chuyển xa ở nhiều nơi."]
  ],
  steps:["Bố trí bấc đứng như thường lệ.","Trải các tuyến bấc ngang theo hàng, nối đầu các bấc đứng vào bấc ngang.","Dẫn bấc ngang ra mép nền đến hệ thống rãnh thoát.","Kiểm tra khả năng thoát nước của bấc ngang (lưu lượng, chiều dài tuyến) đủ cho lưu lượng nước ép ra."],
  notes:["Lợi ích chính: giảm khối lượng và chi phí cát đệm. Điểm cần kiểm tra: khả năng thoát nước của bấc ngang theo chiều dài tuyến, vì bấc ngang dài thì lưu lượng lớn dần về mép.","Chi tiết thiết kế và định mức xem trong bảng tính và bài giảng của khóa học."],
  quiz:[["Mục đích chính của bấc thấm ngang là gì?","Thay thế một phần hoặc toàn bộ lớp đệm cát thoát nước, nhằm giảm chi phí."]]
 },
 {
  id:"m2t3", title:"Đắp gia tải và đắp bù lún",
  summary:"Hai khái niệm dễ nhầm. Đắp bù lún là phần đất đắp thêm để sau khi đất lún, mặt nền vẫn đạt cao độ thiết kế. Đắp gia tải là phần đất đắp thêm tạm thời để ép đất lún nhanh, sau đó dỡ bỏ.",
  concepts:[
   ["Đắp bù lún","Vì nền sẽ lún S (m), nếu chỉ đắp đến cao độ thiết kế thì sau lún mặt nền thấp hơn thiết kế. Nên đắp cao hơn lượng bù tương ứng. Phần này được giữ lại vĩnh viễn trong nền."],
   ["Đắp gia tải (preloading, surcharge)","Đắp thêm một lớp đất tạm thời cao hơn cao độ thiết kế để tăng ứng suất, làm đất lún nhanh và bù luôn phần lún dư. Sau thời gian chờ thì dỡ phần gia tải."],
   ["Lún dư","Phần lún còn lại sau khi đã làm mặt đường. Yêu cầu lún dư nhỏ (cụ thể theo từng loại đường và vị trí) để mặt đường không bị nứt, biến dạng."]
  ],
  steps:[
   "Tính tổng lún S theo hạng mục thời gian và tải.",
   "Đắp bù lún: chiều cao bù ≈ S (phần đất đắp có thể bị chìm dưới mực nước nên trọng lượng riêng thay đổi, cần xét khi tính chính xác).",
   "Chọn chiều cao gia tải sao cho sau thời gian chờ, độ cố kết đạt yêu cầu và lún dư trong giới hạn.",
   "Khối lượng đất đắp bù lún ≈ diện tích mặt cắt phần bù lún × chiều dài đoạn nền.",
   "Khối lượng đất gia tải ≈ diện tích mặt cắt phần gia tải × chiều dài đoạn nền. Phần này được dỡ đi và có thể dùng lại ở đoạn khác."
  ],
  notes:["Nền đắp có mái dốc nên mặt cắt ngang là hình thang, tính diện tích theo công thức hình thang (a + b)/2 × h với a, b là hai đáy.","Gia tải quá cao hoặc đắp quá nhanh có thể gây trượt nền. Phải kiểm tra ổn định theo từng giai đoạn đắp (Module 6)."],
  quiz:[["Phần nào được dỡ bỏ sau khi hết thời gian chờ: đắp bù lún hay đắp gia tải?","Đắp gia tải. Đắp bù lún nằm lại trong nền."]]
 },
 {
  id:"m2t4", title:"Dự báo lún bằng phương pháp Asaoka và Hyperbolic",
  summary:"Khi đã đắp và đo lún ngoài hiện trường, ta dùng số liệu quan trắc để suy ra độ lún cuối cùng. Hai phương pháp phổ biến là Asaoka và Hyperbolic.",
  concepts:[
   ["Số liệu quan trắc lún","Chuỗi độ lún đo tại các thời điểm. Với Asaoka, các thời điểm phải cách đều nhau một khoảng Δt (thường 10–30 ngày)."],
   ["S<sub>∞</sub>","Độ lún cuối cùng dự báo (khi thời gian tiến tới vô cùng)."]
  ],
  formulas:[
   {name:"Phương pháp Asaoka", f:"S<sub>i</sub> = β<sub>0</sub> + β<sub>1</sub> × S<sub>i−1</sub>  ⇒  S<sub>∞</sub> = β<sub>0</sub> / (1 − β<sub>1</sub>)",
    symbols:[["S<sub>i</sub>","Độ lún tại thời điểm thứ i."],["S<sub>i−1</sub>","Độ lún tại thời điểm trước đó (cách Δt)."],["β<sub>0</sub>","Tung độ gốc của đường thẳng hồi quy."],["β<sub>1</sub>","Độ dốc của đường thẳng hồi quy (từ 0 đến 1 khi cố kết ổn định)."]],
    cond:"Vẽ các điểm (S<sub>i−1</sub>, S<sub>i</sub>), kẻ đường thẳng đi qua các điểm; S<sub>∞</sub> là giao điểm với đường 45° (S<sub>i</sub> = S<sub>i−1</sub>). Cần β<sub>1</sub> &lt; 1."},
   {name:"Phương pháp Hyperbolic", f:"S(t) = S<sub>0</sub> + (t − t<sub>0</sub>) / [α + β × (t − t<sub>0</sub>)]  ⇒  S<sub>∞</sub> = S<sub>0</sub> + 1/β",
    symbols:[["S(t)","Độ lún tại thời điểm t."],["S<sub>0</sub>, t<sub>0</sub>","Độ lún và thời điểm bắt đầu lấy số liệu (thường sau khi đắp xong)."],["α, β","Hai hệ số xác định bằng cách vẽ (t − t<sub>0</sub>)/(S − S<sub>0</sub>) theo (t − t<sub>0</sub>): đường thẳng có tung độ gốc α và độ dốc β."]],
    cond:"Chỉ dùng phần số liệu nằm sau giai đoạn đắp, khi các điểm nằm trên một đường thẳng."}
  ],
  example:{title:"Ví dụ Asaoka",html:"Hồi quy các điểm lún cho β<sub>0</sub> = 5 cm và β<sub>1</sub> = 0,90.<br>S<sub>∞</sub> = 5 / (1 − 0,90) = 5 / 0,10 = <b>50 cm</b>.<br>Nếu lún hiện tại đo được là 42 cm thì còn khoảng 8 cm lún dư, tức đã đạt 42/50 = 84%."},
  steps:["Chọn dữ liệu sau khi hết đắp, bỏ các điểm bị nhiễu.","Chọn khoảng Δt đều (với Asaoka), lập bảng S<sub>i</sub> và S<sub>i−1</sub>.","Hồi quy tuyến tính tìm β<sub>0</sub>, β<sub>1</sub> (hoặc α, β).","Tính S<sub>∞</sub> và độ cố kết hiện tại U = S đo / S<sub>∞</sub>.","Dự báo thời điểm đạt yêu cầu để quyết định dỡ tải."],
  notes:["Kết quả phụ thuộc đoạn số liệu được chọn. Nên thử nhiều đoạn và so sánh. Dự báo chỉ tin cậy khi số liệu đã đủ dài để đường lún có xu hướng ổn định."],
  quiz:[["Asaoka đòi hỏi điều kiện gì về số liệu?","Các thời điểm quan trắc cách đều nhau một khoảng thời gian Δt không đổi."]]
 },
 {
  id:"m2t5", title:"Khi nào dùng giếng cát, khi nào dùng bấc thấm",
  summary:"Cả hai đều rút ngắn đường thoát nước. Chọn loại nào là bài toán cân bằng giữa kỹ thuật, tiến độ và giá thành.",
  table:{head:["Tiêu chí","Bấc thấm PVD","Giếng cát SD"],rows:[
   ["Thi công","Nhanh, máy cắm gọn, ít tốn vật liệu","Chậm hơn, cần khoan hoặc đóng ống, nhiều cát"],
   ["Giá thành","Thường rẻ hơn khi cắm trên diện rộng","Có thể rẻ hơn khi cát tại chỗ dồi dào và rẻ"],
   ["Khả năng thoát nước","Phụ thuộc tiết diện và tính chất băng","Lớn do tiết diện cát lớn"],
   ["Nguy cơ hư hỏng","Băng có thể gãy, xoắn khi lún lớn","Cột cát có thể bị đứt khi đất biến dạng ngang lớn"]]},
  steps:["Xác định chiều sâu lớp đất yếu cần xử lý và tiến độ yêu cầu.","Khảo sát nguồn cát thoát nước tại địa phương và giá.","Tính cả hai phương án (cùng yêu cầu U) rồi so sánh chi phí và thời gian.","Cân nhắc điều kiện máy móc, mặt bằng và tính quen thuộc của nhà thầu."],
  notes:["Bảng trên chỉ là nhận định chung. Tiêu chí lựa chọn cụ thể và kinh nghiệm thực tế được hướng dẫn trong bài giảng của khóa học."],
  quiz:[["Vì sao phải so sánh cả giá thành lẫn kỹ thuật?","Vì phương án rẻ nhất chưa chắc đạt yêu cầu lún dư và thời gian, còn phương án tốt nhất về kỹ thuật chưa chắc kinh tế."]]
 }
 ]
},
{
 id:"m3", title:"Module 3 - Đào thay đất kết hợp đóng cọc tre",
 intro:"Với lớp đất yếu nông và mỏng, cách đơn giản là đào bỏ rồi thay bằng vật liệu tốt, đóng thêm cọc tre để nén chặt và tăng sức chịu tải cho lớp đất bên dưới.",
 topics:[
 {
  id:"m3t1", title:"Đào thay đất kết hợp đóng cọc tre",
  summary:"Đào bỏ lớp đất yếu trên cùng, đóng cọc tre dày đặc xuống đáy hố, rồi đắp cát hoặc đất tốt đầm chặt.",
  concepts:[
   ["Cọc tre","Cọc ngắn bằng cây tre, đường kính ngọn khoảng 6–8 cm, dài khoảng 2,5–3 m, đóng dày khoảng 16–25 cọc/m²."],
   ["Cơ chế làm việc","Cọc tre không chủ yếu chịu tải như cọc bê tông. Tác dụng chính là làm chặt đất xung quanh khi đóng, tăng sức chịu tải của nền."],
   ["Điều kiện tre bền","Tre đặt thường xuyên dưới mực nước ngầm sẽ ít bị mục, nên đầu cọc cần nằm thấp hơn mực nước ngầm thấp nhất."],
   ["Đệm cát hoặc đất tốt","Lớp vật liệu thay thế, đầm chặt từng lớp, phân bố đều tải xuống nền."]
  ],
  steps:["Đào lớp đất yếu đến độ sâu thiết kế.","Đóng cọc tre theo lưới đã chọn, đầu cọc đều nhau.","Rải lớp cát hoặc đất tốt, đầm chặt từng lớp.","Kiểm tra độ chặt và sức chịu tải sau xử lý."],
  notes:["Số liệu về đường kính, chiều dài, mật độ cọc ở trên là phạm vi thường gặp. Thiết kế cụ thể dùng bảng tính theo phương pháp trong khóa học.","Lấy bảng tính xử lý nền cọc tre theo GS.TS. Trần Như Hối làm đối chiếu nếu bạn đã có."],
  quiz:[["Vì sao đầu cọc tre phải nằm dưới mực nước ngầm?","Tre ngập nước liên tục ít bị mục, cọc bền hơn. Tre khô ẩm xen kẽ sẽ nhanh hỏng."]]
 },
 {
  id:"m3t2", title:"Lưu ý khi dùng biện pháp và phạm vi áp dụng",
  summary:"Biện pháp này đơn giản và rẻ nhưng chỉ phù hợp trong một số điều kiện.",
  steps:["Chỉ áp dụng khi lớp đất yếu mỏng (thường chỉ vài mét) và nằm gần mặt đất.","Mực nước ngầm cao để cọc tre luôn ngập nước.","Phải có biện pháp thoát nước hố móng khi đào, tránh sạt vách.","Công trình nhẹ, tải trọng không quá lớn (nhà thấp tầng, đường nội bộ, cống, đoạn nền nhỏ).","Nguồn tre phải đủ chất lượng, thẳng, đủ tuổi."],
  notes:["Với lớp đất yếu dày hoặc tải lớn, biện pháp này không đủ hiệu quả, cần dùng bấc thấm, cọc xi măng đất hoặc giải pháp khác (Module 2, 4, 5).","Mức tải và độ dày lớp yếu tối đa cụ thể của khóa học cần đối chiếu theo bài giảng."],
  quiz:[["Đất yếu dày 15 m, có nên dùng đào thay đất kết hợp cọc tre không?","Không. Đào sâu 15 m rất tốn kém và khó thi công. Nên chọn giải pháp khác như bấc thấm hoặc cọc xi măng đất."]]
 }
 ]
},
{
 id:"m4", title:"Module 4 - Xử lý nền bằng cọc đất gia cố xi măng",
 intro:"Cọc xi măng đất (CDM) được tạo bằng cách trộn xi măng vào đất yếu ngay tại chỗ. Cọc cứng hơn nhiều so với đất xung quanh, cùng nhau tạo thành nền “tổng hợp” chịu tải tốt, lún ít.",
 topics:[
 {
  id:"m4t1", title:"Cọc xi măng đất CDM (phương pháp trộn ướt) và hai tiêu chuẩn",
  summary:"Trộn ướt: bơm vữa xi măng lỏng vào đất qua cần khoan có cánh trộn. Khóa học tính theo hai tiêu chuẩn, mỗi tiêu chuẩn phụ trách các kiểm toán khác nhau.",
  concepts:[
   ["CDM","Cement Deep Mixing, phương pháp trộn sâu xi măng với đất."],
   ["q<sub>u</sub>","Cường độ kháng nén một trục của mẫu đất trộn xi măng (kPa hoặc MPa). Là thông số quan trọng nhất của cọc."],
   ["E<sub>50</sub> hoặc E","Mô đun đàn hồi của đất trộn xi măng, thường lấy theo bội số của q<sub>u</sub> (ví dụ vài chục đến vài trăm lần, tùy loại đất và hàm lượng xi măng)."],
   ["a<sub>s</sub>","Tỷ lệ diện tích thay thế = diện tích tiết diện cọc / diện tích đất mà một cọc phụ trách."],
   ["Nền tương đương","Coi vùng cọc và đất xung quanh là một khối vật liệu đồng nhất có các thông số quy đổi để tính lún và ổn định."]
  ],
  formulas:[
   {name:"Tỷ lệ diện tích thay thế", f:"a<sub>s</sub> = A<sub>cọc</sub> / A<sub>ô</sub>",
    symbols:[["a<sub>s</sub>","Tỷ lệ thay thế, không đơn vị."],["A<sub>cọc</sub>","Diện tích tiết diện một cọc (m²) = π d²/4 với d là đường kính cọc."],["A<sub>ô</sub>","Diện tích ô lưới của một cọc (m²). Lưới vuông cạnh s thì A<sub>ô</sub> = s²."]],
    cond:"Thường a<sub>s</sub> trong khoảng từ vài phần trăm đến khoảng 30%."},
   {name:"Mô đun biến dạng của nền tương đương", f:"E<sub>td</sub> = a<sub>s</sub> × E<sub>cọc</sub> + (1 − a<sub>s</sub>) × E<sub>đất</sub>",
    symbols:[["E<sub>td</sub>","Mô đun của nền tương đương (kPa)."],["E<sub>cọc</sub>","Mô đun của cọc xi măng đất (kPa)."],["E<sub>đất</sub>","Mô đun của đất yếu giữa các cọc (kPa)."]],
    cond:"Dạng trung bình theo diện tích. Dùng để tính lún của khối nền gia cố."}
  ],
  example:{title:"Ví dụ tính nền tương đương",html:"Cọc d = 0,6 m, lưới vuông s = 1,2 m; E<sub>cọc</sub> = 60 MPa; E<sub>đất</sub> = 2 MPa.<br>Bước 1: A<sub>cọc</sub> = π × 0,6² / 4 ≈ 0,2827 m².<br>Bước 2: A<sub>ô</sub> = 1,2² = 1,44 m².<br>Bước 3: a<sub>s</sub> = 0,2827 / 1,44 ≈ 0,196 (khoảng 19,6%).<br>Bước 4: E<sub>td</sub> = 0,196 × 60 + (1 − 0,196) × 2 = 11,76 + 1,61 ≈ <b>13,4 MPa</b>.<br>Nhận xét: nền yếu 2 MPa được nâng lên 13,4 MPa, gấp khoảng 6,7 lần."},
  table:{head:["Tiêu chuẩn (theo đề cương)","Nhiệm vụ trong khóa học"],rows:[
   ["TCVN 9403:2012","Kiểm toán lún và ổn định trượt theo phương pháp nền tương đương"],
   ["TCVN 9906:2014","Kiểm toán sức chịu tải của cọc, sức chịu tải của đất nền, lực kéo trong vải địa kỹ thuật hoặc lưới địa kỹ thuật đặt ở đầu cọc"]]},
  steps:["Chọn đường kính cọc, lưới bố trí, chiều dài cọc.","Chọn q<sub>u</sub> và E đưa vào tính từ kết quả thí nghiệm trộn thử.","Tính nền tương đương, kiểm toán lún và ổn định trượt theo tiêu chuẩn thứ nhất.","Kiểm toán sức chịu tải cọc, đất nền và lực kéo lưới theo tiêu chuẩn thứ hai.","Tối ưu hàm lượng xi măng và chiều dài cọc."],
  notes:["Tên và phạm vi áp dụng chính xác của từng tiêu chuẩn cần đối chiếu với văn bản gốc; ở đây chỉ ghi lại theo đề cương khóa học."],
  quiz:[["Tăng đường kính cọc thì a<sub>s</sub> thay đổi thế nào, nếu giữ nguyên lưới?","A<sub>cọc</sub> tăng nên a<sub>s</sub> tăng, nền tương đương cứng hơn."]]
 },
 {
  id:"m4t2", title:"Tính cọc CDM nhiều hàm lượng xi măng trên cùng một cọc",
  summary:"Đất yếu thay đổi theo độ sâu, và tải truyền xuống giảm theo độ sâu. Không cần dùng cùng một hàm lượng xi măng suốt chiều dài cọc.",
  concepts:[
   ["Hàm lượng xi măng","Khối lượng xi măng trộn cho 1 m³ đất (kg/m³). Hàm lượng càng cao, q<sub>u</sub> càng lớn nhưng giá thành càng cao."],
   ["Phân đoạn cọc","Đoạn trên chịu tải lớn dùng hàm lượng cao; đoạn dưới chịu tải nhỏ hơn dùng hàm lượng thấp."]
  ],
  steps:["Chia cọc thành 2–3 đoạn theo độ sâu và loại đất.","Gán q<sub>u</sub> và E tương ứng với hàm lượng của từng đoạn.","Kiểm tra sức chịu tải cọc tại tiết diện mỗi đoạn, đặc biệt chỗ giáp ranh.","So sánh chi phí với phương án một hàm lượng cho cả cọc."],
  notes:["Ở chỗ chuyển hàm lượng, cần đảm bảo cường độ đoạn yếu vẫn chịu được lực tại tiết diện đó."],
  quiz:[["Vì sao đoạn cọc phía dưới có thể dùng hàm lượng xi măng thấp hơn?","Lực dọc trong cọc giảm dần theo độ sâu vì một phần tải truyền sang đất bằng ma sát hông."]]
 },
 {
  id:"m4t3", title:"Thí nghiệm mẫu trộn thử, chọn q<sub>u</sub> và E",
  summary:"Cường độ cọc phụ thuộc rất mạnh vào loại đất. Cần trộn thử trong phòng thí nghiệm để biết cần bao nhiêu xi măng cho đất của dự án.",
  steps:["Lấy mẫu đất yếu thật của dự án ở các độ sâu khác nhau.","Trộn đất với xi măng ở nhiều hàm lượng (ví dụ 3–4 mức).","Dưỡng hộ mẫu (thường 7, 14, 28 ngày) rồi nén một trục để có q<sub>u</sub>.","Vẽ quan hệ q<sub>u</sub> theo hàm lượng và theo tuổi mẫu.","Chọn giá trị đưa vào bảng tính có xét hệ số suy giảm vì cọc ngoài hiện trường thường kém đồng đều hơn mẫu phòng thí nghiệm."],
  notes:["Cường độ ngoài hiện trường thường thấp hơn đáng kể so với mẫu phòng thí nghiệm. Hệ số chiết giảm cụ thể phải theo kinh nghiệm hoặc quy định của dự án, và được chốt bằng cọc thử ngoài hiện trường.","Không nên lấy giá trị q<sub>u</sub> lớn nhất của mẫu để thiết kế. Chọn giá trị đại diện và an toàn."],
  quiz:[["Vì sao không đưa q<sub>u</sub> mẫu phòng thí nghiệm trực tiếp vào bảng tính?","Điều kiện trộn ngoài hiện trường kém đồng đều hơn, cường độ thực tế thường thấp hơn."]]
 },
 {
  id:"m4t4", title:"Thi công cọc thử, khoan lõi và nén tĩnh",
  summary:"Cọc thử là cọc làm trước toàn bộ để kiểm chứng thiết kế trước khi thi công đại trà.",
  steps:["Chọn vài vị trí thử đại diện cho các loại đất khác nhau, mỗi vị trí thử vài hàm lượng xi măng.","Thi công cọc thử theo đúng thiết bị, tốc độ khoan, tốc độ bơm vữa dự định dùng đại trà.","Sau thời gian dưỡng hộ (thường 28 ngày), khoan lấy lõi liên tục dọc thân cọc.","Thí nghiệm nén các đoạn lõi tại nhiều độ sâu để có q<sub>u</sub> theo độ sâu.","Nén tĩnh cọc để đo sức chịu tải và độ lún thực tế.","So sánh với thiết kế, điều chỉnh hàm lượng xi măng nếu cần."],
  notes:["Hàm lượng xi măng cho cọc thử nên chọn bao quanh giá trị dự kiến (thấp hơn, bằng và cao hơn) để tìm điểm tối ưu.","Chia sẻ kinh nghiệm chọn hàm lượng cụ thể nằm trong bài giảng của khóa học."],
  quiz:[["Mục đích của khoan lõi cọc thử?","Kiểm tra cường độ và độ liên tục của cọc theo chiều dài, vì mẫu phòng thí nghiệm không phản ánh đầy đủ."]]
 },
 {
  id:"m4t5", title:"Xử lý khi cọc thử không đạt hoặc các đoạn chênh lệch cường độ",
  summary:"Khi kết quả thử thấp hơn thiết kế hoặc các đoạn cọc cho cường độ lệch nhau nhiều, cần tìm nguyên nhân rồi chọn phương án phù hợp.",
  steps:["Kiểm tra quy trình thi công: lượng vữa bơm, tốc độ rút cần, số lần trộn.","Kiểm tra chất lượng vật liệu: xi măng, nước, tỷ lệ nước/xi măng của vữa.","Xem lại loại đất: lớp có hữu cơ cao, độ ẩm quá lớn thường khó đạt cường độ.","Phương án: tăng hàm lượng xi măng cho đoạn yếu, tăng số lần trộn, hoặc đổi loại phụ gia.","Phương án khác: giảm khoảng cách cọc hoặc tăng đường kính cọc để bù cường độ.","Thử lại bằng cọc thử mới trước khi thi công đại trà."],
  notes:["Cần ghi nhận nguyên nhân vì cùng một đất nhưng thi công khác nhau cho cường độ khác nhau."],
  quiz:[["Hai cách bù khi cường độ cọc thấp hơn dự tính?","Tăng hàm lượng xi măng, hoặc tăng a<sub>s</sub> (cọc dày hơn hoặc to hơn) để nền tương đương vẫn đạt yêu cầu."]]
 }
 ]
},
{
 id:"m5", title:"Module 5 - Bấc thấm kết hợp hút chân không (VCM)",
 intro:"Thay vì chỉ đắp đất gia tải, hút chân không tạo áp suất âm dưới tấm màng kín khí, ép nước trong đất ra qua bấc thấm. Đề cương ghi module này bắt đầu triển khai từ tháng 11/2025.",
 topics:[
 {
  id:"m5t1", title:"Phương pháp bấc thấm kết hợp hút chân không",
  summary:"Màng kín khí phủ kín mặt nền. Bơm chân không hút không khí và nước từ hệ thống ống và bấc thấm, tạo áp suất âm. Áp suất khí quyển bên ngoài ép lên màng, tương đương một tải trọng đắp.",
  concepts:[
   ["VCM","Vacuum Consolidation Method, cố kết chân không."],
   ["Áp suất chân không","Thường duy trì khoảng 80 kPa dưới màng (khoảng 80% áp suất khí quyển)."],
   ["Tải tương đương","Với tải 80 kPa và đất đắp có γ = 18 kN/m³, chiều cao đắp tương đương = 80 / 18 ≈ 4,4 m."],
   ["Ưu điểm so với đắp gia tải","Chân không tăng ứng suất hữu hiệu theo mọi phương, không làm tăng ứng suất cắt như đắp đất, nên nguy cơ trượt thấp hơn. Có thể kết hợp thêm đắp gia tải."]
  ],
  steps:["Trải lớp đệm cát và cắm bấc thấm đứng.","Lắp hệ thống ống thu nước ngang nối với đầu bấc.","Trải màng kín khí, chôn mép màng trong hào kín khí.","Nối ống với bơm chân không, chạy bơm và theo dõi áp suất.","Quan trắc lún, áp lực nước lỗ rỗng, mực nước ngầm cho đến khi đạt yêu cầu."],
  notes:["Chi tiết tính toán trong bảng tính kèm khóa học. Con số 80 kPa là mức thường gặp, giá trị thực tế phụ thuộc thiết bị và độ kín của hệ thống."],
  quiz:[["Vì sao hút chân không ít gây mất ổn định nền hơn đắp gia tải?","Áp suất âm làm tăng ứng suất hữu hiệu mà không tăng ứng suất cắt, không đẩy đất ra phía mái như tải đắp."]]
 },
 {
  id:"m5t2", title:"Thiết bị và bố trí hiện trường",
  summary:"Hệ thống chỉ hoạt động tốt khi kín khí. Mỗi bộ phận có vai trò riêng.",
  table:{head:["Bộ phận","Ý nghĩa"],rows:[
   ["Bơm chân không","Hút khí và nước, duy trì áp suất âm dưới màng."],
   ["Màng kín khí","Tấm màng nhựa phủ kín vùng xử lý để giữ chân không. Rách là mất chân không."],
   ["Hào kín khí","Hào đào quanh mép vùng xử lý, chôn mép màng và lấp bằng đất sét hoặc bùn bentonite để bịt khe hở."],
   ["Tường sét","Dùng khi nền có lớp cát, thấm ngang mạnh, để chặn không khí hoặc nước lọt vào vùng xử lý."],
   ["Ống thu và ống dẫn","Nối đầu bấc thấm với bơm, dẫn nước và khí về trạm bơm."],
   ["Đồng hồ đo, thiết bị quan trắc","Đo áp suất chân không dưới màng, áp lực nước lỗ rỗng, lún."]]},
  notes:["Chi tiết lắp đặt và bố trí hiện trường nên xem bài giảng của khóa học, đi kèm hình ảnh thực tế."],
  quiz:[["Hào kín khí và tường sét khác nhau chỗ nào?","Hào kín khí bịt mép màng ở trên mặt. Tường sét chắn các lớp thấm sâu bên dưới để chân không không bị thất thoát."]]
 }
 ]
},
{
 id:"m6", title:"Module 6 - Kiểm toán trượt",
 intro:"Đắp nền trên đất yếu có thể làm mất ổn định cả khối đất theo mặt trượt cung tròn. Cần tính hệ số an toàn, thường bằng phần mềm Geoslope (SLOPE/W).",
 topics:[
 {
  id:"m6t1", title:"Kiểm toán điều kiện trượt nền đập và dùng Geoslope",
  summary:"Hệ số an toàn trượt là tỷ số giữa khả năng chống trượt và lực gây trượt của khối đất, tính cho nhiều mặt trượt giả định rồi lấy mặt trượt nguy hiểm nhất.",
  formulas:[{
   name:"Hệ số an toàn ổn định trượt",
   f:"F<sub>s</sub> = Σ (lực chống trượt) / Σ (lực gây trượt)",
   symbols:[["F<sub>s</sub>","Hệ số an toàn, không đơn vị."],["Lực chống trượt","Sức chống cắt của đất dọc mặt trượt, phụ thuộc c và φ."],["Lực gây trượt","Thành phần trọng lượng khối đất theo phương tiếp tuyến của mặt trượt và các tải ngoài."]],
   cond:"F<sub>s</sub> phải lớn hơn hoặc bằng giá trị cho phép của tiêu chuẩn áp dụng cho công trình và tổ hợp tải đó. F<sub>s</sub> &lt; 1 là mất ổn định."
  }],
  concepts:[
   ["Mặt trượt","Mặt giả định theo đó khối đất trượt, thường là cung tròn. Phần mềm thử rất nhiều tâm và bán kính."],
   ["Phương pháp tính","Geoslope có Bishop, Janbu, Morgenstern-Price, Spencer. Mỗi phương pháp giả thiết khác nhau về lực giữa các lát cắt."]
  ],
  steps:["Vẽ mặt cắt nền đập và các lớp đất.","Chọn mô hình vật liệu và thông số cho từng lớp (bài sau).","Khai báo mực nước, áp lực nước lỗ rỗng, tải trọng.","Chọn phương pháp tính, khai báo lưới tâm trượt và bán kính.","Chạy và đọc F<sub>s</sub> nhỏ nhất, xem mặt trượt nguy hiểm.","Chạy cho từng giai đoạn đắp, và cho các tổ hợp tải khác nhau."],
  notes:["Giá trị F<sub>s</sub> cho phép tùy loại công trình và tiêu chuẩn. Đối chiếu tiêu chuẩn thiết kế dự án."],
  quiz:[["F<sub>s</sub> = 1,05 có coi là an toàn không?","Thường không, vì rất gần giới hạn mất ổn định và thấp hơn mức yêu cầu của hầu hết tiêu chuẩn."]]
 },
 {
  id:"m6t2", title:"Thí nghiệm nén 3 trục: mô hình CU và UU",
  summary:"Nén ba trục cho sức chống cắt của đất. Điều kiện thoát nước khi thí nghiệm quyết định thông số nhận được và áp dụng cho tình huống nào.",
  table:{head:["Mô hình","Ý nghĩa","Dùng khi"],rows:[
   ["UU (không cố kết, không thoát nước)","Mẫu không được cố kết trước và không cho thoát nước khi cắt. Cho cường độ không thoát nước c<sub>u</sub> (với đất sét bão hòa thường φ<sub>u</sub> ≈ 0).","Tính ổn định ngắn hạn khi vừa đắp xong, đất chưa kịp cố kết."],
   ["CU (cố kết, không thoát nước)","Mẫu cố kết dưới áp lực buồng, sau đó cắt không thoát nước, đo áp lực nước lỗ rỗng. Cho c<sub>cu</sub>, φ<sub>cu</sub> hoặc c′, φ′ (ứng suất hữu hiệu).","Tính ổn định khi đất đã cố kết một phần, hoặc có gia tải theo giai đoạn."]]},
  concepts:[
   ["c<sub>u</sub> (hoặc S<sub>u</sub>)","Cường độ chống cắt không thoát nước (kPa)."],
   ["c′, φ′","Lực dính và góc ma sát theo ứng suất hữu hiệu."]
  ],
  notes:["Nền đắp theo giai đoạn làm đất cố kết dần, cường độ tăng theo thời gian. Mô hình chọn phải phản ánh đúng giai đoạn tính."],
  quiz:[["Vừa đắp xong nền trên sét yếu bão hòa, nên dùng thông số UU hay CU?","UU, vì đất chưa kịp thoát nước, cường độ là cường độ không thoát nước."]]
 },
 {
  id:"m6t3", title:"Thí nghiệm cắt cánh hiện trường",
  summary:"Cắt cánh đo trực tiếp cường độ không thoát nước S<sub>u</sub> của sét yếu tại chỗ, ít xáo trộn hơn lấy mẫu.",
  formulas:[{
   name:"Cường độ cắt cánh không thoát nước (cánh hình chữ nhật, hai đầu cắt)",
   f:"S<sub>u</sub> = 2T / [ π × D² × (H + D/3) ]",
   symbols:[["S<sub>u</sub>","Cường độ cắt không thoát nước (kPa)."],["T","Mô men xoắn lớn nhất đo được khi đất bị phá hoại (kN·m)."],["D","Đường kính cánh (m), tức chiều rộng cánh."],["H","Chiều cao cánh (m)."]],
   cond:"Công thức thuộc dạng cánh chữ nhật chuẩn, giả thiết ứng suất phân bố đều trên mặt trụ và hai đầu. Đơn vị cần thống nhất khi thay số."
  }],
  concepts:[
   ["Yếu tố ảnh hưởng","Tốc độ xoay, thời gian chờ trước khi xoay, vật liệu lẫn cát hoặc vỏ sò, sét có tính dị hướng, và xáo trộn khi ấn cánh vào đất."],
   ["Hệ số hiệu chỉnh","Giá trị S<sub>u</sub> đo hiện trường thường nhân với hệ số hiệu chỉnh (phụ thuộc chỉ số dẻo) trước khi dùng cho tính ổn định."]

  ["Công thức lún đến từ đâu",
   `<p>Khi đất nén, thể tích lỗ rỗng giảm. Nếu hệ số rỗng giảm một lượng Δe thì chiều dày lớp giảm theo tỷ lệ Δe / (1 + e<sub>0</sub>). Nhân với chiều dày H được độ lún: S = H × Δe / (1 + e<sub>0</sub>). Trên đồ thị e – lg σ′, đoạn nén nguyên thủy là đường thẳng với độ dốc C<sub>c</sub>, nên Δe = C<sub>c</sub> × lg[(σ′<sub>v0</sub> + Δσ) / σ′<sub>v0</sub>]. Thay vào ta có công thức ở trên.</p>`],
  ["Đất quá cố kết: tách làm hai đoạn",
   `<p>Khi σ′<sub>v0</sub> nhỏ hơn σ′<sub>p</sub> (đất từng chịu áp lực lớn hơn trong quá khứ), phần tải đầu tiên chỉ nén lại đất trên đoạn có độ dốc C<sub>s</sub> (nhỏ). Chỉ khi áp lực vượt σ′<sub>p</sub> đất mới nén mạnh với độ dốc C<sub>c</sub>:</p>
    <div class="formula"><div class="fx">Nếu σ′<sub>v0</sub> + Δσ &gt; σ′<sub>p</sub>:<br>S = [C<sub>s</sub>/(1+e<sub>0</sub>)] H lg(σ′<sub>p</sub>/σ′<sub>v0</sub>) + [C<sub>c</sub>/(1+e<sub>0</sub>)] H lg[(σ′<sub>v0</sub>+Δσ)/σ′<sub>p</sub>]</div>
    <div class="tr"><b>Trong đó:</b> C<sub>s</sub> là chỉ số nở (độ dốc đoạn nén lại, nhỏ hơn C<sub>c</sub> nhiều); σ′<sub>p</sub> là áp lực tiền cố kết; các đại lượng còn lại như công thức ban đầu. Nếu σ′<sub>v0</sub> + Δσ ≤ σ′<sub>p</sub> thì chỉ còn số hạng đầu, với lg[(σ′<sub>v0</sub>+Δσ)/σ′<sub>v0</sub>].</div></div>
    <div class="example"><div class="eh">Ví dụ từng bước</div>H = 3 m; e<sub>0</sub> = 1,2; C<sub>s</sub> = 0,1; C<sub>c</sub> = 0,5; σ′<sub>v0</sub> = 40 kPa; σ′<sub>p</sub> = 60 kPa; Δσ = 50 kPa.<br>Bước 1: σ′<sub>v0</sub> + Δσ = 90 kPa, lớn hơn σ′<sub>p</sub> = 60 nên phải tách hai đoạn.<br>Bước 2: đoạn nén lại = 0,1/2,2 × 3 × lg(60/40) = 0,04545 × 3 × 0,1761 ≈ 0,024 m.<br>Bước 3: đoạn nguyên thủy = 0,5/2,2 × 3 × lg(90/60) = 0,2273 × 3 × 0,1761 ≈ 0,120 m.<br>Bước 4: S = 0,024 + 0,120 ≈ <b>0,144 m</b>.</div>`],
  ["Ước tính gia tăng ứng suất Δσ dưới nền đắp",
   `<p>Một cách gần đúng thường dùng cho tải dải rộng là phân bố tải theo độ sâu: Δσ ≈ q × B / (B + z). Trong đó q là tải trọng đáy nền đắp (kPa) = γ<sub>đắp</sub> × h, với γ<sub>đắp</sub> là dung trọng đất đắp và h là chiều cao đắp; B là bề rộng tải (m); z là độ sâu từ đáy nền đắp đến điểm tính (m). Ví dụ q = 60 kPa, B = 20 m, z = 5 m cho Δσ ≈ 60 × 20 / 25 = 48 kPa. Dưới tim nền rộng, Δσ gần bằng q ở độ sâu nông và giảm dần khi xuống sâu. Tiêu chuẩn cơ sở 41-2022 có cách tính riêng của nó, nên dùng cách đó khi lập hồ sơ.</p>`],
  ["Ba thành phần của lún",
   `<p>Tổng lún gồm lún tức thời (xảy ra ngay khi đặt tải, do đất biến dạng không thoát nước), lún cố kết sơ cấp (do nước thoát ra, là phần chính của bài này) và lún thứ cấp (đất tiếp tục nén chậm kể cả khi nước đã thoát hết, thường đáng kể với đất hữu cơ và bùn). Bảng tính cần ghi rõ đã tính thành phần nào.</p>`]
 ],

  ["Vì sao d<sub>e</sub> bằng 1,05 s và 1,13 s",

  ["Kể thêm vùng đất bị xáo trộn (smear) quanh bấc",

    <p>Giá trị S và k<sub>h</sub>/k<sub>s</sub> thường chọn theo kinh nghiệm hoặc khuyến nghị của tiêu chuẩn thiết kế. Bảng tính của khóa học đã kể đến các yếu tố này.</p>`],

  ["Cơ chế thoát nước của hệ PVD + SBD",
   `<p>Nước từ đất yếu đi theo ba chặng: (1) chảy ngang từ đất vào bấc đứng, (2) chảy lên theo bấc đứng, (3) chảy ngang theo lớp thoát nước ở mặt nền về mép. Chặng (3) có thể do lớp cát đệm đảm nhiệm hoặc do bấc thấm ngang. Điều kiện để hệ làm việc là khả năng thoát nước của chặng cuối không được nhỏ hơn lưu lượng nước mà các bấc đứng đẩy lên.</p>`],

   `<p>Phần đất đắp bù lún có hình thang đặt ngay dưới mặt nền, chiều cao bằng độ lún S. Diện tích mặt cắt ≈ (a + b)/2 × S, trong đó a là bề rộng mặt nền thiết kế (m), b = a + 2 m S là bề rộng đáy lớp bù (m), với m là hệ số mái dốc (mái 1:1,5 thì m = 1,5).</p>
    <div class="example"><div class="eh">Ví dụ từng bước</div>Mặt nền rộng a = 12 m; mái 1:1,5 (m = 1,5); lún S = 0,8 m; đoạn nền dài L = 100 m.<br>Bước 1: b = 12 + 2 × 1,5 × 0,8 = 14,4 m.<br>Bước 2: diện tích mặt cắt = (12 + 14,4)/2 × 0,8 = 13,2 × 0,8 = 10,56 m².<br>Bước 3: thể tích ≈ 10,56 × 100 ≈ <b>1 056 m³</b> đất đắp bù lún.<br>Đây là thể tích nền sau đầm nén. Khi lập dự toán phải nhân thêm hệ số đầm nén K và phần hao hụt vận chuyển theo định mức.</div>
    <p>Khối lượng gia tải được tính tương tự: diện tích hình thang của phần gia tải × chiều dài. Vì phần này được dỡ đi nên chi phí gồm cả đắp và dỡ, nhưng có thể tận dụng đất ở đoạn kế tiếp.</p>`],

  ["Cách thực hiện Asaoka bằng bảng tính",

  ["Ví dụ Hyperbolic",

  ["Khi nào dự báo đáng tin",

   `<p>Cọc cứng hơn đất nhiều nên “hút” tải về phía mình. Với giả thiết cọc và đất lún bằng nhau (biến dạng như nhau), ứng suất trên cọc σ<sub>p</sub> và trên đất σ<sub>s</sub> khi tải mặt là q:</p>
    <div class="formula"><div class="fx">σ<sub>p</sub> = n × q / [1 + (n − 1) a<sub>s</sub>] &nbsp;&nbsp; σ<sub>s</sub> = q / [1 + (n − 1) a<sub>s</sub>]</div>
    <div class="tr"><b>Trong đó:</b> n = E<sub>cọc</sub> / E<sub>đất</sub> là tỷ số mô đun của cọc và đất; a<sub>s</sub> là tỷ lệ diện tích thay thế; q là tải phân bố trên mặt (kPa).</div></div>
    <div class="example"><div class="eh">Ví dụ nối tiếp với ví dụ ở trên</div>E<sub>cọc</sub> = 60 MPa, E<sub>đất</sub> = 2 MPa nên n = 30; a<sub>s</sub> = 0,196; q = 60 kPa.<br>Bước 1: 1 + (30 − 1) × 0,196 = 1 + 5,68 = 6,68.<br>Bước 2: σ<sub>p</sub> = 30 × 60 / 6,68 ≈ <b>269 kPa</b>.<br>Bước 3: σ<sub>s</sub> = 60 / 6,68 ≈ <b>9 kPa</b>.<br>Kiểm tra cân bằng: 0,196 × 269 + 0,804 × 9 ≈ 52,7 + 7,2 ≈ 60 kPa, đúng bằng q.<br>Nhận xét: cọc chịu ứng suất gấp khoảng 30 lần đất, nên cường độ cọc q<sub>u</sub> phải đủ lớn so với 269 kPa (cùng hệ số an toàn thích hợp).</div>`],

  ["Mô men trượt trong trường hợp φ = 0 (sét yếu, ngắn hạn)",
   `<p>Với đất sét bão hòa chịu tải nhanh (φ = 0), hệ số an toàn của cung tròn có thể tính trực tiếp bằng mô men quanh tâm O:</p>
    <div class="formula"><div class="fx">F<sub>s</sub> = c<sub>u</sub> × L × R / (W × x)</div>
    <div class="tr"><b>Trong đó:</b> c<sub>u</sub> là cường độ không thoát nước (kPa); L là chiều dài cung trượt (m); R là bán kính cung (m); W là trọng lượng khối đất trượt trên một mét dài (kN/m); x là cánh tay đòn từ trọng tâm khối trượt đến phương thẳng đứng qua tâm O (m). Tử số là mô men chống trượt, mẫu số là mô men gây trượt.</div></div>
    <div class="example"><div class="eh">Ví dụ từng bước</div>c<sub>u</sub> = 20 kPa; cung trượt có góc ở tâm 90°, bán kính R = 10 m; W = 400 kN/m; x = 7 m.<br>Bước 1: L = π R × 90/180 = 3,1416 × 10 / 2 ≈ 15,71 m.<br>Bước 2: mô men chống = 20 × 15,71 × 10 ≈ 3 142 kN·m/m.<br>Bước 3: mô men gây trượt = 400 × 7 = 2 800 kN·m/m.<br>Bước 4: F<sub>s</sub> = 3 142 / 2 800 ≈ <b>1,12</b>. Thấp hơn mức yêu cầu thông thường nên cần giảm tải hoặc gia cường nền.</div>`],
  ["Phương pháp lát cắt Bishop",
   `<p>Với đất có cả c′ và φ′, nền thường tính bằng phương pháp lát cắt. Chia khối trượt thành các lát đứng bề rộng b; mỗi lát chịu trọng lượng W, áp lực nước lỗ rỗng u và nghiêng với góc α ở đáy. Công thức Bishop đơn giản:</p>
    <div class="formula"><div class="fx">F<sub>s</sub> = Σ [ (c′ b + (W − u b) tan φ′) / m<sub>α</sub> ] / Σ (W sin α), &nbsp; m<sub>α</sub> = cos α × (1 + tan α tan φ′ / F<sub>s</sub>)</div>
    <div class="tr"><b>Trong đó:</b> c′ và φ′ là lực dính và góc ma sát hữu hiệu; (W − u b) là phần lực thẳng đứng thực sự truyền qua hạt đất. Vì F<sub>s</sub> có mặt cả hai vế nên phần mềm giải bằng lặp. Bạn không cần tính tay, chỉ cần hiểu các đại lượng này để đọc đúng kết quả phần mềm.</div></div>`],
  ["Hệ số an toàn cho phép",
   `<p>Giá trị F<sub>s</sub> yêu cầu tùy cấp công trình, tổ hợp tải (đang thi công, lâu dài, có động đất) và tiêu chuẩn áp dụng. Với nền đắp trên đất yếu, giá trị thường nằm trong khoảng từ khoảng 1,2 đến 1,5 tùy trường hợp. Hãy dùng đúng con số trong tiêu chuẩn của dự án.</p>`]
 ],

  if(x===null||x===undefined||!isFinite(x)) return "—";
  if(x===0) return "0";
  const a=Math.abs(x);
  if(a<1e-4||a>=1e9) return x.toExponential(2).replace(".",",");
  return (+x.toFixed(d)).toString().replace(".",",");
}
const pct = (u,d=1)=>fmt(u*100,d)+"%";
const fx = h => h.replace(/\{\{([^{}|]+)\|([^{}]+?)\}\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
const avg = a => a.reduce((s,x)=>s+x,0)/a.length;
function linreg(xs,ys){
  const n=xs.length, mx=avg(xs), my=avg(ys);
  let sxx=0,sxy=0,syy=0;
  for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my);syy+=(ys[i]-my)**2;}
  if(sxx===0) return null;
  const b1=sxy/sxx, b0=my-b1*mx;
  return {b0,b1,r2:syy===0?1:sxy*sxy/(sxx*syy),n};
}
function bisect(f,lo,hi,target,it=90){ for(let i=0;i<it;i++){const m=(lo+hi)/2; if(f(m)<target) lo=m; else hi=m;} return (lo+hi)/2; }
const TvOfU = U => U<0.6 ? Math.PI/4*U*U : -0.933*lg(1-U)-0.085;
const UofTv = T => T<=0 ? 0 : (T<=Math.PI/4*0.36 ? Math.sqrt(4*T/Math.PI) : 1-Math.pow(10,-(T+0.085)/0.933));
function drainGeom(a,b,s,pat){ const dw=2*(a+b)/Math.PI/1000; const de=(pat==="tri"?1.05:1.13)*s; return {dw,de,n:de/dw}; }
const Fn = (n,sm)=> sm ? ln(n/sm.S)+sm.r*ln(sm.S)-0.75 : ln(n)-0.75;

function settleLayer(H,e0,Cc,Cs,sv0,sp,ds){
  const s1=sv0+ds, k=1+e0, parts=[];
  if(sp<=sv0*1.0001) parts.push({lab:"nén nguyên thủy (đất cố kết thường)",c:Cc,cn:"C<sub>c</sub>",from:sv0,to:s1});
  else if(s1<=sp) parts.push({lab:"nén lại (đất quá cố kết, chưa vượt σ′<sub>p</sub>)",c:Cs,cn:"C<sub>s</sub>",from:sv0,to:s1});
  else { parts.push({lab:"nén lại từ σ′<sub>v0</sub> đến σ′<sub>p</sub>",c:Cs,cn:"C<sub>s</sub>",from:sv0,to:sp});
         parts.push({lab:"nén nguyên thủy từ σ′<sub>p</sub> đến σ′<sub>v0</sub> + Δσ",c:Cc,cn:"C<sub>c</sub>",from:sp,to:s1}); }
  parts.forEach(p=>{p.S=p.c/k*H*lg(p.to/p.from);});

function asaoka(arr){
  const r=linreg(arr.slice(0,-1),arr.slice(1)); if(!r) return null;
  r.Sinf = r.b1<1 ? r.b0/(1-r.b1) : NaN; return r;
}
function hyper(ts,ss,k0){
  const t0=ts[k0], S0=ss[k0], xs=[], ys=[];
  for(let i=k0+1;i<ts.length;i++){ if(ss[i]-S0>0){ xs.push(ts[i]-t0); ys.push((ts[i]-t0)/(ss[i]-S0)); } }
  if(xs.length<2) return null;
  const r=linreg(xs,ys); if(!r) return null;
  r.alpha=r.b0; r.beta=r.b1; r.t0=t0; r.S0=S0; r.Sinf = r.beta>0 ? S0+1/r.beta : NaN; return r;
}

let _cp=0;
function niceTicks(a,b,n=5){
  const span=b-a; if(!(span>0)) return [a];
  const raw=span/n, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  const step=(m<1.5?1:m<3.5?2:m<7.5?5:10)*p, out=[];
  for(let v=Math.ceil(a/step-1e-9)*step; v<=b+1e-9; v+=step) out.push(+v.toFixed(10));
  return out;
}
function chart(o){
  const W=o.w||640,H=o.h||290,L=62,R=18,T=26,B=46,pw=W-L-R,ph=H-T-B;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*pw;
  const Y=y=>o.rev ? T+(y-o.y0)/(o.y1-o.y0)*ph : T+ph-(y-o.y0)/(o.y1-o.y0)*ph;
  const id="cp"+(++_cp); let b=`<clipPath id="${id}"><rect x="${L}" y="${T}" width="${pw}" height="${ph}"/></clipPath>`;
  niceTicks(o.x0,o.x1,6).forEach(v=>{const x=X(v).toFixed(1); b+=`<line class="gridl" x1="${x}" y1="${T}" x2="${x}" y2="${T+ph}"/><text class="t2" x="${x}" y="${T+ph+16}" text-anchor="middle">${fmt(v,2)}</text>`;});
  niceTicks(o.y0,o.y1,5).forEach(v=>{const y=Y(v).toFixed(1); b+=`<line class="gridl" x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}"/><text class="t2" x="${L-6}" y="${(+y+4)}" text-anchor="end">${fmt(v,2)}</text>`;});
  b+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="none" class="ln thin"/>`;
  b+=`<g clip-path="url(#${id})">`;
  (o.hl||[]).forEach(h=>{ b+=`<line class="${h.cls||"ln"} thin dash" x1="${L}" y1="${Y(h.y).toFixed(1)}" x2="${L+pw}" y2="${Y(h.y).toFixed(1)}"/>`; });
  (o.vl||[]).forEach(h=>{ b+=`<line class="${h.cls||"ln"} thin dash" x1="${X(h.x).toFixed(1)}" y1="${T}" x2="${X(h.x).toFixed(1)}" y2="${T+ph}"/>`; });
  (o.series||[]).forEach(s=>{
    const pts=s.pts.filter(p=>isFinite(p[0])&&isFinite(p[1]));
    if(s.dots) pts.forEach(p=>{ b+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="${s.fill||"var(--amber)"}"/>`; });
    else b+=`<polyline class="${s.cls||"ac"}" points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;
  });
  b+=`</g>`;
  (o.marks||[]).forEach(m=>{
    if(!isFinite(m.x)||!isFinite(m.y)) return;
    const x=X(m.x),y=Y(m.y);
    b+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${m.fill||"var(--red)"}"/>`;
    if(m.label){ const left=x>L+pw*0.6; b+=`<text class="tb hlw" x="${(left?x-9:x+9).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="${left?"end":"start"}">${m.label}</text>`; }
  });
  let ly=T+16;
  (o.series||[]).forEach(s=>{ if(!s.name) return;
    b+=(s.dots?`<circle cx="${L+18}" cy="${ly-4}" r="4" fill="${s.fill||"var(--amber)"}"/>`:`<line class="${s.cls||"ac"}" x1="${L+8}" y1="${ly-4}" x2="${L+30}" y2="${ly-4}"/>`)+`<text x="${L+36}" y="${ly}">${s.name}</text>`; ly+=17; });
  if(o.xl) b+=`<text x="${L+pw}" y="${H-6}" text-anchor="end">${o.xl}</text>`;
  if(o.yl) b+=`<text x="6" y="14">${o.yl}</text>`;
  return SV(W,H,o.alt||"Đồ thị",b);
}

{id:"time",title:"Thời gian cố kết thẳng đứng (Terzaghi)",desc:"Biết độ cố kết U tìm thời gian t, hoặc biết t tìm U; vẽ đường lún theo thời gian.",topics:["m1t4"],

 syms:[["U","Độ cố kết trung bình (0–100%)."],["T<sub>v</sub>","Nhân tố thời gian thẳng đứng = C<sub>v</sub> t / H<sub>dr</sub>²."],["C<sub>v</sub>","Hệ số cố kết thẳng đứng. 1 cm²/s ≈ 3 153,6 m²/năm."],["H<sub>dr</sub>","Chiều dài đường thoát nước dài nhất (m)."],["t","Thời gian (năm)."]],
 compute(v){

  steps.push(v.cu==="cm2s"?`Đổi đơn vị: C<sub>v</sub> = ${fmt(n.Cv,5)} cm²/s × 3 153,6 = <b>${fmt(Cv,4)} m²/năm</b> (vì 1 cm²/s = 10⁻⁴ m² × 31 536 000 s/năm).`:`C<sub>v</sub> = <b>${fmt(Cv,4)} m²/năm</b>.`);

  return {res:[["Thời gian t",fmt(t,3)+" năm","≈ "+TIME_TXT(t)],["Độ cố kết U",pct(U),""],["T<sub>v</sub>",fmt(Tv,4),""],["H<sub>dr</sub>",fmt(Hdr,2)+" m",""]].concat(hasS?[["Lún tại t",fmt(U*S,1)+" cm","trong tổng "+fmt(S)+" cm"]]:[]),steps,chart:ch};

{id:"drain",title:"Bấc thấm PVD: độ cố kết theo phương ngang",desc:"Tính U<sub>h</sub>, độ cố kết tổng, thời gian cần thiết và khoảng cách bấc lớn nhất; so sánh nhiều khoảng cách s.",topics:["m2t1","m2t2"],
 fields:[F_("ch","Hệ số cố kết ngang, c_h",2,"m²/năm"),F_("cv","Hệ số cố kết đứng, C_v",1,"m²/năm","Để tính phần cố kết đứng U_v"),F_("Hdr","Đường thoát nước đứng, H_dr",8,"m"),F_("a","Bề rộng băng bấc, a",100,"mm"),F_("b","Bề dày băng bấc, b",4,"mm"),SEL("pat","Kiểu lưới",[["tri","Tam giác (d_e = 1,05 s)"],["sq","Vuông (d_e = 1,13 s)"]],"tri"),F_("s","Khoảng cách bấc, s",1.2,"m"),F_("t","Thời gian chờ, t",0.5,"năm"),F_("Ut","Độ cố kết yêu cầu",90,"%"),SEL("sm","Kể vùng đất bị xáo trộn (smear)?",[["no","Không (lý tưởng)"],["yes","Có"]],"no"),F_("S","Tỷ số d_s / d_w",2,"","Chỉ dùng khi kể smear; chọn theo khuyến nghị/kinh nghiệm"),F_("r","Tỷ số k_h / k_s",2,"","Chỉ dùng khi kể smear; chọn theo khuyến nghị/kinh nghiệm")],

 compute(v){

  let sm=null; if(v.sm==="yes"){ const m=reqNums(v,["S","r"]); if(m.err) return m; if(m.S<1||m.r<=0) return {err:"d_s/d_w phải ≥ 1 và k_h/k_s phải > 0."}; sm=m; }

  const tmax=Math.max(tT*1.6,n.t*1.2), ser=[];
